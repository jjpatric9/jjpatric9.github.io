   sends touches back. That is exactly the division `viz` already has — a second
   renderer of one shared state — and it is the reason the advert can no longer
   drift from the game about a rule.

   default is the tower's own loss condition. A hidden backstop prevents an expert
   or abandoned webview from running forever and celebrates the standing tower. */

var CRATE_LIMIT = 6;          // URL-only `?ends=crates&n=6` experiment

   there because an ad network expects a playable to end; a visitor to the site
   has chosen to play, and a clock ending a good tower half a minute in cut short
   the thing the demo is for. So there it ends when the tower falls or on the
   fiftieth crate, standing — the same `crates` ending the URL experiments use. */

var audio = null;          // null untried, false unavailable, else the context
var muted = false;

/* **Built at load, started on the first touch.** Constructing a context and
   decoding into it needs no gesture — only *starting* a sound does — and doing
   both on the touch meant the decode had not finished by the time that same
   touch asked for a sound: the first crate of every run came up silent, which
   is the one pickup that has to say the advert has a voice. Nothing is audible
   any earlier for it; the context is created suspended and stays that way. */
function startAudio() {
  if (audio !== null) return;
  audio = false;
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = new Ctx();
    // One master gain, as the phone keeps: the effects carry their own level in
    // the files and play at unity, so a gain per sound here would be a second
    // opinion about a mix that has already been mastered against a ceiling.
    var gain = ctx.createGain();
    gain.gain.value = 1;
    gain.connect(ctx.destination);
    var buf = {};
    for (var key in SOUND_B64) decodeInto(ctx, buf, key);
    audio = { ctx: ctx, gain: gain, buf: buf };
  } catch (err) { audio = false; }
}

/** The gesture every browser waits for before a suspended context will sound. */
function wakeAudio() {
  startAudio();
  try { if (audio && audio.ctx.resume) audio.ctx.resume(); } catch (err) {}
}
function decodeInto(ctx, buf, key) {
  try {
    var bin = atob(SOUND_B64[key]), n = bin.length, bytes = new Uint8Array(n);
    for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(bytes.buffer,
      function (decoded) { buf[key] = decoded; },
      function () {});
  } catch (err) {}
}

/** One sound, at [rate], [delayMs] from now. Silent and harmless until ready. */
function cue(name, rate, delayMs) {

    var s = audio.ctx.createBufferSource();

    ctx.lineWidth = Math.max(2, L.cell * 0.045);
    var radius = L.cell * (0.36 + p * 1.65);

    ctx.globalAlpha *= 0.72;

      var angle = ray * Math.PI / 4;
      var inner = radius + L.cell * 0.10, outer = inner + L.cell * (0.20 + p * 0.25);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
      ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
      ctx.stroke();
    }
    ctx.restore();
  }

  var life = p < 0.12 ? p / 0.12 : Math.max(0, (1 - p) / 0.28);
  if (life <= 0) return;

  // crate below the opening tower's height scores nothing, and "+0" read as a
  // reward that was not one. The phone never floats a zero either.
  if (r.rows === 0 && r.gain <= 0) return;
  var label = r.rows > 0 ? (r.rows > 1 ? r.rows + " ROWS" : "ROW COMPLETE") : "+" + r.gain;
  var labelX = r.rows > 0 ? L.shaft.x + L.shaft.w / 2 : cx;
  var rise = L.cell * (0.45 + p * 0.75);
  var fontSize = Math.round(readable(L.cell * (r.rows > 0 ? 0.37 : 0.43)));
  var labelY = Math.max(L.fieldTop + fontSize, Math.min(L.fieldTop + L.shaft.h - fontSize, cy - rise));
  ctx.save();
  ctx.globalAlpha = life * strength;

  ctx.font = "700 " + fontSize + "px CP, system-ui, sans-serif";

  var half = ctx.measureText(label).width / 2 + L.cell * 0.24;
  labelX = Math.max(L.shaft.x + half, Math.min(L.shaft.x + L.shaft.w - half, labelX));
  ctx.shadowColor = alpha(C.craneLit, 0.85); ctx.shadowBlur = L.cell * 0.24;
  ctx.fillStyle = r.rows > 0 ? C.ink : C.craneLit;

}
/* The boat, built out of the same boxes as everything else on the board: its

function drawPlatform() {
  var courses = E.hullCourses(), W_ = E.boardWidth;
  if (!courses.length || (!SCENE && rowY(E.deckRow) > L.shaft.y + L.shaft.h)) return;
  for (var y = E.deckRow; y >= 0; y--) {
    var span = courses[y], from = (W_ - span) / 2;
    var depth = E.deckRow <= 0 ? 0 : (E.deckRow - y) / E.deckRow;
    var shade = mixHex(C.platform, C.hullDark, depth);
    for (var i = 0; i < span; i++) slab(colX(from + i), rowY(y), L.cell, L.cell, shade);
  }
  var py = rowY(E.deckRow) + L.cell * (0.06 + 1.34);
  for (var p = 0; p < 2; p++) {
    var px = L.shaft.x + L.shaft.w * (p === 0 ? 0.3125 : 0.6875);
    ctx.fillStyle = C.hullKeel; ctx.beginPath(); ctx.arc(px, py, L.cell * 0.115, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.porthole; ctx.beginPath(); ctx.arc(px, py, L.cell * 0.075, 0, Math.PI * 2); ctx.fill();

function mixHex(from, to, t) {
  var a = parseInt(from.slice(1), 16), b = parseInt(to.slice(1), 16), out = 0;

}
/* The crane's beam: lit along the top, shadowed underneath, a bloom below it and
   hazard striping at both ends. */
function drawGantry() {
  // The rail is the beam, not the shaft: in landscape it runs the width of the
  // dockyard, which is what turns the room either side of the board into
  // machinery. In portrait the two are the same box and nothing changes.
  var s = L.beam, thick = Math.max(6, L.cell * 0.175);
  var top = L.shaft.y - L.craneStrip + L.craneStrip * 0.20;
  var bloom = ctx.createLinearGradient(0, top + thick, 0, top + thick * 4);
  bloom.addColorStop(0, alpha(C.crane, 0.22));
  bloom.addColorStop(1, alpha(C.crane, 0));
  ctx.fillStyle = bloom; ctx.fillRect(s.x, top + thick, s.w, thick * 3);
  var beam = ctx.createLinearGradient(0, top, 0, top + thick);
  beam.addColorStop(0, C.craneLit); beam.addColorStop(1, C.craneShadow);
  ctx.fillStyle = beam; ctx.fillRect(s.x, top, s.w, thick);
  ctx.fillStyle = C.crane; ctx.fillRect(s.x, top + thick / 4, s.w, thick / 2);
  var cap = s.w * 0.16;
  ctx.save();
  ctx.beginPath(); ctx.rect(s.x, top, s.w, thick); ctx.clip();
  ctx.fillStyle = C.craneStripe;
  var ends = [s.x, s.x + s.w - cap];
  for (var e = 0; e < 2; e++) {
    for (var x = ends[e] - thick; x < ends[e] + cap; x += thick * 1.24) {
      ctx.beginPath();
      ctx.moveTo(x, top + thick);
      ctx.lineTo(x + thick * 0.62, top);
      ctx.lineTo(x + thick * 1.24, top);
      ctx.lineTo(x + thick * 0.62, top + thick);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
  L.beamTop = top; L.beamThick = thick;
}

/* The column the crane is over. **The game's own drag**: the piece starts over
   the berth it was taken from and moves by how far the finger has, at the
   game's reach (`PlayfieldGeometry.carriedCellX`, `DRAG_GAIN`), rather than
   jumping to whatever column is under the finger. Clamped: the crane cannot
   leave the board. */
function carriedCellX(c) {
  return E.carriedCellX(c.anchorCellX, c.anchorFingerX, c.px, L.cell);
}
function aimedColumn() {
  if (!G.carried) return 0;
  var sh = handShape(G.carried.slot);
  if (!sh) return 0;
  return Math.max(0, Math.min(E.boardWidth - sh.w, Math.round(carriedCellX(G.carried))));
}
/* Where a crate on the mat starts along the crane: over its own berth
   (`PlayfieldGeometry.cellXOfCenter`), or the nearest the crane can get to it —

function startCellX(slot) {
  var s = traySlot(slot), sh = handShape(slot), w = sh ? sh.w : 1;
  var x = (s.x + s.w / 2 - L.shaft.x) / L.cell - w / 2;
  return Math.max(0, Math.min(E.boardWidth - w, x));
}
/* A finger that has gone back over the hand is putting the crate back. */
function overHand(p) {
  var t = L.tray;
  return p.x >= t.x - 4 && p.x <= t.x + t.w + 4 && p.y >= t.y - 4 && p.y <= t.y + t.h + 4;
}

/* It hangs from the crane, because that is what the game does: picking a crate
   out of the tray puts it on the cable at the top of the shaft **at once** and
   the finger moves it along the beam. It used to fly up from the tray, which
   is a picture of the gesture rather than what the game does with it. Over the
   hand again, it fades: letting go there puts it back. */
function drawCarried() {
  var c = G.carried; if (!c || G.falling) return;
  var sh = handShape(c.slot); if (!sh) return;
  var col = aimedColumn(), ly = E.landingY(c.slot, col);

  if (ly >= 0) {
    // Inside the playfield, as the game's ghost is. The camera follows a landing
    // up but never down, so one far below the summit is out of the window — and
    // drawn unclipped, it landed on the dealer.
    ctx.save();
    clipToShaft();
    var inset = L.cell * 0.0875, r = L.cell * 0.125, side = L.cell - inset * 2;
    ctx.lineWidth = Math.max(2, L.cell * 0.038);
    ctx.setLineDash([L.cell * 0.1125, L.cell * 0.0875]);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    var closing = closingRows();
    for (var j = 0; j < sh.cells.length; j++) {
      var gx = colX(col + sh.cells[j][0]) + inset, gy = rowY(ly + sh.cells[j][1]) + inset;
      var shut = closingColor(closing, ly + sh.cells[j][1]);
      var cellColor = packedRgb(E.handColor(sh.ord));
      ctx.fillStyle = shut ? alpha(shut, 0.88) : alpha(cellColor, 0.133);
      rr(gx, gy, side, side, r); ctx.fill();
      ctx.strokeStyle = alpha(cellColor, 0.745);
      rr(gx, gy, side, side, r); ctx.stroke();
    }

    ctx.restore();

  var centre = px + (sh.w * L.cell) / 2;

  ctx.strokeStyle = C.craneCable; ctx.lineWidth = Math.max(2, L.cell * 0.038);
  ctx.beginPath();
  ctx.moveTo(centre, L.beamTop + L.beamThick * 0.85);
  ctx.lineTo(centre, py); ctx.stroke();
  ctx.fillStyle = C.crane;
  ctx.fillRect(centre - L.cell * 0.325, L.beamTop - L.cell * 0.075, L.cell * 0.65, L.cell * 0.30);
  if (c.returning) ctx.globalAlpha = was * 0.35;
  for (var i = 0; i < sh.cells.length; i++) {
    var tint = ly < 0 ? "#FF5A5A" : packedRgb(E.handColor(sh.ord));
    slab(px + sh.cells[i][0] * L.cell, py + (sh.h - 1 - sh.cells[i][1]) * L.cell,
         L.cell, L.cell, tint);
  }
  ctx.globalAlpha = was;
}

function drawFalling() {
  var f = G.falling; if (!f) return;
  var p = f.p * f.p;
  var yy = f.y0 + (rowY(f.to + f.shape.h - 1) - f.y0) * p;
  // It falls from the crane into the playfield and never leaves it, so a drop
  // to somewhere under the window goes out of the bottom rather than over the dealer.
  ctx.save();
  clipToShaft();
  for (var i = 0; i < f.shape.cells.length; i++) {
    var tint = packedRgb(E.handColor(f.shape.ord));
    slab(colX(f.x + f.shape.cells[i][0]), yy + (f.shape.h - 1 - f.shape.cells[i][1]) * L.cell,
         L.cell, L.cell, tint);
  }
  ctx.restore();
}

/* The playfield's own window, the same rectangle the board is drawn inside. */
function clipToShaft() {
  ctx.beginPath();
  ctx.rect(L.shaft.x - 1, L.shaft.y - 1, L.shaft.w + 2, L.shaft.h + 2);
  ctx.clip();
}

/* `Theme.riskColor`: steel, lemon from 0.45, red from 0.72 — where the game
   itself starts rescuing the player, so the warning and the help arrive together. */
function riskColor(risk) {
  var r = Math.max(0, Math.min(1, risk));
  if (r <= BAR_CAUTION) return mix(C.barFill, C.barCaution, r / BAR_CAUTION);
  if (r < RESCUE_FROM) return mix(C.barCaution, C.barDanger, (r - BAR_CAUTION) / (RESCUE_FROM - BAR_CAUTION));
  return C.barDanger;
}
/** Square against the centre, rounded only at the far end, as the game draws it. */
function balanceFill(g, v, style, a) {
  var half = g.w / 2, mid = g.x + half, len = Math.abs(v) * half, r = g.h / 2;

  ctx.fillStyle = style;
  ctx.beginPath();
  var far = v > 0 ? mid + len : mid - len;
  ctx.moveTo(mid, g.y);
  ctx.lineTo(far - (v > 0 ? r : -r), g.y);
  ctx.arcTo(far, g.y, far, g.y + g.h, r);
  ctx.arcTo(far, g.y + g.h, mid, g.y + g.h, r);
  ctx.lineTo(mid, g.y + g.h);

  ctx.globalAlpha = 1;
}
function drawGauge() {
  var g = L.gauge;
  ctx.fillStyle = C.track; rr(g.x, g.y, g.w, g.h, g.h / 2); ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; rr(g.x, g.y, g.w, g.h, g.h / 2); ctx.stroke();
  var v = Math.max(-1, Math.min(1, G.shownLean));
  balanceFill(g, v, riskColor(Math.abs(v)));
  // What the drop being aimed will do to the tower, at a third strength — the
  // honest shadow of the post-drop reading the game shows for a young tower.
  var hint = G.projected === null ? mimeFrame() : null;
  var projected = G.projected === null && hint ? hint.move.lean : G.projected;
  if (projected !== null) {
    var p = Math.max(-1, Math.min(1, projected));
    balanceFill(g, p, riskColor(Math.abs(p)), hint ? 0.30 * hint.alpha : 0.34);
  }
  if (G.sweep > 0) {
    var q = 1 - G.sweep, half = g.w / 2, mid = g.x + half;
    ctx.globalAlpha = Math.sin(Math.PI * Math.min(1, q * 1.1)) * 0.85;
    ctx.fillStyle = C.craneLit;
    var reach = half * Math.min(1, q * 1.25);
    ctx.fillRect(mid - reach, g.y, reach * 2, g.h);
    ctx.globalAlpha = 1;

  // new one. The normal fill still owns the value; this only celebrates motion
  // toward centre and disappears before the next decision.
  var reward = G.reward;
  if (reward && reward.recovered > 0) {
    var rp = Math.min(1, reward.p / 0.62), fade = Math.max(0, 1 - reward.p / 0.82);
    var half_ = g.w / 2, mid_ = g.x + half_;
    var oldX = mid_ + Math.max(-1, Math.min(1, reward.beforeLean)) * half_;
    var newX = mid_ + Math.max(-1, Math.min(1, reward.afterLean)) * half_;
    var bead = oldX + (newX - oldX) * ease(rp);

    ctx.globalAlpha = fade * Math.min(1, 0.55 + reward.recovered);
    ctx.strokeStyle = C.craneLit; ctx.lineWidth = Math.max(2, g.h * 0.30);

    ctx.restore();

/* Text with tracking, a glyph at a time. `ctx.letterSpacing` is not everywhere
   this has to run, and the wordmark wants a fifth of an em. Kerning goes with
   it, which tracking would have thrown away anyway. */
function tracked(text, cx, y, spacing) {
  var total = -spacing, i;
  for (i = 0; i < text.length; i++) total += ctx.measureText(text[i]).width + spacing;
  var was = ctx.textAlign;
  ctx.textAlign = "left";
  var x = cx - total / 2;
  for (i = 0; i < text.length; i++) {
    ctx.fillText(text[i], x, y);
    x += ctx.measureText(text[i]).width + spacing;
  }
  ctx.textAlign = was;
}

/* Whose game this is. **The game's own score card already carries this at its
   crown**, and in this treatment: dim rather than bright, the display face,
   tracked a fifth of an em — see `ScoreCard.title`. A shared picture has to say
   whose game it is, and so does an advert somebody enjoys and does not tap. */
function wordmark(cx, y, size) {
  ctx.font = "700 " + Math.round(size) + "px CP, system-ui, sans-serif";
  ctx.fillStyle = C.inkDim;
  ctx.textBaseline = "alphabetic";
  tracked("BOX STACK", cx, y, size * 0.20);
}

/* The game's score hierarchy adapted for an advert: the live score owns the middle.
   Height is inspection furniture in the app and starts hidden; the playable does not
   spend a second control teaching it. */
function drawHead() {
  var h = L.head;
  if (h.column) { drawHeadColumn(h); return; }
  var reward = G.reward;
  var punch = reward ? Math.sin(Math.PI * Math.min(1, reward.p / 0.42)) : 0;
  var big = Math.round(h.h * 0.62 * (1 + punch * (reward && reward.first ? 0.16 : 0.08)));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 " + big + "px CP, system-ui, sans-serif";
  ctx.fillStyle = punch > 0 ? mix(C.ink, C.craneLit, punch * 0.72) : C.ink;
  ctx.fillText(String(Math.round(G.shownScore)), h.x + h.w / 2, h.y + h.h * 0.55);
  ctx.textAlign = "left";
}

/* Landscape stands the score beside the board rather than over it, because over
   it there is only room for eight cells of width and the board wants all of them. */
function drawHeadColumn(h) {
  // Ranged against the board's edge rather than the column's, so the readouts
  // sit with the thing they are reading instead of drifting off into the margin.
  var reward = G.reward;
  var punch = reward ? Math.sin(Math.PI * Math.min(1, reward.p / 0.42)) : 0;
  var right = h.x + h.w, size = Math.round(Math.min(W, H) * 0.072 * (1 + punch * (reward && reward.first ? 0.16 : 0.08)));
  var y = h.y + size;
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "right";
  ctx.font = "700 " + size + "px CP, system-ui, sans-serif";
  ctx.fillStyle = punch > 0 ? mix(C.ink, C.craneLit, punch * 0.72) : C.ink;
  ctx.fillText(String(Math.round(G.shownScore)), right, y);
  ctx.textAlign = "left";
}

function traySlot(i) {
  var t = L.tray;
  if (t.column) {
    var h = t.h / 3;
    return { x: t.x, y: t.y + h * i + 5, w: t.w, h: h - 10 };
  }
  var w = t.w / 3;
  return { x: t.x + w * i + 5, y: t.y, w: w - 10, h: t.h };
}
/** The bottom of the shaft carried down behind the hand, with the shaft's own border. */
function drawTray() {
  var t = L.tray, rail = Math.max(1, L.cell * 0.02), radius = Math.max(4, L.cell * 0.12);
  ctx.fillStyle = packedRgb(E.handBackdrop);
  rr(t.x, t.y, t.w, t.h, radius); ctx.fill();
  ctx.strokeStyle = C.frameLit; ctx.lineWidth = rail;
  rr(t.x + rail / 2, t.y + rail / 2, t.w - rail, t.h - rail, radius); ctx.stroke();
  for (var i = 0; i < E.handSize; i++) {
    var sh = handShape(i);
    // **Also the one in the air.** The engine does not consume the crate until
    // it lands, so between the release and the landing the slot still reports a
    // shape — and the crate flashed back into the dealer for the length of its
    // own fall.
    if (!sh || (G.carried && G.carried.slot === i) || (G.falling && G.falling.slot === i)) continue;
    var s = traySlot(i);
    // A berth in the column is nearly square and a crate is at most four cells
    // either way, so it is the smaller side that decides. The row under the
    // board is wide and shallow and takes the cell's own fraction, as it did.
    var sc = L.tray.column ? Math.min(s.w, s.h) / 4.2 : Math.min(L.cell * 0.62, s.h * 0.34);
    var ox = s.x + s.w / 2 - (sh.w * sc) / 2, oy = s.y + s.h / 2 - (sh.h * sc) / 2;
    for (var k = 0; k < sh.cells.length; k++) {
      slab(ox + sh.cells[k][0] * sc, oy + (sh.h - 1 - sh.cells[k][1]) * sc, sc, sc, sh.color);
    }
  }
}

/* The first interaction, shown with a real crate and a move selected through the
   engine. The finger follows it from the highlighted berth, the crane takes it,
   the legal landing outline appears, and the gauge previews the same outcome. */
function drawMime() {
  var hint = mimeFrame(); if (!hint) return;
  var move = hint.move, sh = handShape(move.slot); if (!sh) return;
  var s = traySlot(move.slot), a = hint.alpha;
  var fromX = s.x + s.w / 2, fromY = s.y + s.h / 2;
  // The finger travels exactly as far as a real drag needs to reach the column —
  // the game's reach, from where the crate starts on the crane — so the lesson
  // is the gesture rather than a picture of it.
  var anchor = startCellX(move.slot);
  var toX = fromX + (move.column - anchor) * L.cell / E.dragGain;
  var toY = L.fieldTop + L.cell * Math.min(3.0, sh.h + 0.75);
  var x = fromX + (toX - fromX) * hint.travel;
  var y = fromY + (toY - fromY) * hint.travel;

  // The berth is the first instruction: this is the thing to touch.
  var pulse = 0.5 + 0.5 * Math.sin(hint.phase * Math.PI * 4);
  ctx.globalAlpha = a * (0.55 + pulse * 0.30);
  ctx.strokeStyle = C.craneLit; ctx.lineWidth = Math.max(2, L.cell * 0.045);
  rr(s.x + 2, s.y + 2, s.w - 4, s.h - 4, Math.max(6, L.cell * 0.15)); ctx.stroke();

  // Reuse the live carried-piece drawing so the lesson cannot promise a motion,
  // colour, landing, row completion, or crane position that play does not keep:
  // on the crane from the press, sliding as the finger does, faint until the
  // finger has left the hand.
  if (hint.travel > 0) {
    var real = G.carried;
    G.carried = { slot: move.slot, px: x, py: y, anchorCellX: anchor, anchorFingerX: fromX,
                  returning: overHand({ x: x, y: y }) };
    ctx.globalAlpha = a * 0.72;
    drawCarried();
    G.carried = real;
  }

  // A simple fingertip and palm reads as touch without the old dotted route or
  // target glyph, both of which looked like annotations instead of a gesture.
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.18);
  ctx.globalAlpha = a * 0.88;
  ctx.fillStyle = C.ink;
  var r = Math.max(10, L.cell * 0.27);
  // Raised index, palm, and tucked thumb — recognisable at ad scale without
  // relying on an emoji font a network webview may not have.
  rr(-r * 0.18, -r * 1.05, r * 0.62, r * 1.55, r * 0.31); ctx.fill();
  rr(-r * 0.55, -r * 0.08, r * 1.20, r * 1.12, r * 0.38); ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.55, r * 0.36, r * 0.34, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.craneLit; ctx.lineWidth = Math.max(1.5, r * 0.13);
  ctx.beginPath(); ctx.arc(r * 0.13, -r * 0.78, r * 0.50, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  var textY = Math.min(rowY(E.stackHeight - 1) - L.cell * 0.65, L.fieldTop + L.cell * 4.85);
  textY = Math.max(L.fieldTop + L.cell * 3.9, textY);
  ctx.globalAlpha = a * 0.94;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 " + Math.round(readable(L.cell * 0.34)) + "px CP, system-ui, sans-serif";
  ctx.fillStyle = C.ink;
  tracked("DRAG TO BUILD", L.shaft.x + L.shaft.w / 2, textY, Math.max(1, L.cell * 0.025));
  ctx.globalAlpha = 1; ctx.textAlign = "left";
}
function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/* ----------------------------------------------------------- the fall ------ */

/* The game's own ending, not an impression of it. `ResultsAnim` owns every
   duration and every curve; this holds the canvas transforms they describe.

   Three beats, and the first is the point of it: the camera pulls back until the
   whole tower is in frame, holds a moment on it, and only then does the boat go
   over — rolling about its own bottom corner with its cargo still on it, coming
   apart where it lands. The advert used to throw squares from where they stood,
   which is the one shot in a playable everybody watches to the end. */

var SCENE = null;

function startFall(standing, reason) {
  if (G.fall || G.ended) return;
  G.endReason = reason || (standing ? "limit" : "topple");
  G.fall = { p: 0, revealing: E.revealing(L.rows), standing: !!standing,
             reveal: 0, topple: 0, impact: 0, crashed: false };
  report(standing ? "survived" : "loss", { reason: reason || (standing ? "limit" : "topple") });
  // Held back so the crash's loudest moment lands on the impact rather than
  // over the pull-back. `ResultsAnim` measured that offset off the asset.
  if (!standing) cue("topple", 1, E.toppleSoundDelayMs);
}
function stepFall(dt) {
  var f = G.fall;
  f.p = Math.min(1, f.p + dt / E.deathSeconds);
  f.reveal = E.revealPhase(f.p, f.revealing);
  // A standing safety/experiment ending stops after the pull-back and its beat:
  // there is nothing to knock over, and the whole tower is the honest reward.
  if (f.standing) {
    if (f.p >= E.revealDone(f.revealing)) { G.ended = true; G.endT = 0; }
    return;
  }
  f.topple = E.topplePhase(f.p, f.revealing);
  f.impact = E.impactPhase(f.topple);
  // The knock belongs to the landing, not to the start: shaking as the camera
  // pulls back says the tower has hit when it has not yet moved.
  if (!f.crashed && f.impact > 0) { f.crashed = true; G.shake = 1; }
  if (f.p >= 1) { G.ended = true; G.endT = 0; }
}

/* The pull-back. **The frame is a fixed window and the scene shrinks inside it**
   — the same split `PlayfieldGeometry.sceneMetrics` makes, and for the same
   reason: scaling the frame too would narrow the whole dockyard to a strip and
   leave a long run looking skinny rather than looking tall.

   Row zero's underside is pinned to the floor of the shaft and the board stays
   centred, so the boat sits on the ground at every scale. */
function withScene(body) {
  var f = G.fall;
  var rows = L.rows + (E.revealRows(L.rows) - L.rows) * f.reveal;
  var bottom = (viewTopRow() - L.rows) * (1 - f.reveal);
  var mid = L.shaft.x + L.shaft.w / 2;
  SCENE = {
    s: L.rows / rows,
    y0: L.fieldTop + (viewTopRow() - bottom) * L.cell,
    fy: L.fieldTop + L.shaft.h,
  };
  ctx.save();
  ctx.translate(mid, SCENE.fy);
  ctx.scale(SCENE.s, SCENE.s);
  ctx.translate(-mid, -SCENE.y0);
  body();
  ctx.restore();
  SCENE = null;
}

/* Everything turns about the waterline under the boat, on the side it is going.
   The hull rolls onto its gunwale and that corner stays where it is — pivoting
   on the deck instead would tip the cargo off a boat that stayed level, which is
   a crane accident rather than a capsize. */
function withTopple(body) {
  var f = G.fall;
  if (f.topple <= 0) { body(); return; }
  var px = colX(E.pivotColumn), py = SCENE.y0;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(E.toppleDegrees(f.topple) * Math.PI / 180);
  ctx.translate(-px, -py);
  body();
  ctx.restore();
}

/* The cargo bursting where the tower landed. One call for the whole heap: the
   engine returns x, y, degrees, cell and row for every block, and the boat is
   not among them — it lies where the capsize left it. */
function drawBurst() {
  var a = E.burst(colX(0), rowY(0) + L.cell, L.cell,
                  colX(E.pivotColumn), SCENE.y0, G.fall.impact);
  for (var i = 0; i < a.length; i += 5) {
    ctx.save();
    ctx.translate(a[i] + L.cell / 2, a[i + 1] + L.cell / 2);
    ctx.rotate(a[i + 2] * Math.PI / 180);
    slab(-L.cell / 2, -L.cell / 2, L.cell, L.cell, packedRgb(a[i + 3]));
    ctx.restore();
  }
}

/* The order `GameLayout` draws it in: once the tower has broken up the blocks
   are on their own and only the hull is still turning. */
function drawFall() {
  withScene(function () {
    if (G.fall.impact > 0) {
      drawBurst();
      withTopple(drawPlatform);
    } else {
      withTopple(function () { drawPlatform(); drawBoard(); });
    }
  });
}

/* ------------------------------------------------------------- end card ---- */

/* The tower they built, fitted to [w] by [h] and standing on the floor of it.
   Drawn with the board's own crates and the boat's own planks rather than flat
   squares: it is the only picture on the card and it is a picture of their run. */
function cardTower(x, y, w, h) {
  var hgt = Math.max(1, E.stackHeight), W_ = E.boardWidth;
  var mini = Math.min(w / W_, h / hgt);
  var mx = x + w / 2 - (W_ * mini) / 2, floor = y + h;
  var courses = E.hullCourses();
  for (var i = 0; i < hgt; i++) {
    var py = floor - (i + 1) * mini;
    if (i < courses.length) {
      if (courses[i] > 0) {
        slab(mx + ((W_ - courses[i]) / 2) * mini, py, courses[i] * mini, mini, C.platform);
      }
      continue;
    }
    var shade = E.isSolid(i) ? setRowColor(i) : null;
    for (var x2 = 0; x2 < W_; x2++) {
      var v = E.cellAt(x2, i);
      if (v !== 0) slab(mx + x2 * mini, py, mini, mini, shade || crateColor(v, x2, i));
    }
  }
}

/* Reveal the run from the boat upward. A tower is the advert's product shot;
   giving it the first beat makes the result feel earned before the numbers ask
   for attention. The glow distinguishes a tower that is still standing from a
   capsize without replacing the tower somebody actually built. */
function cardTowerMoment(x, y, w, h, reveal) {
  var glow = ctx.createRadialGradient(x + w / 2, y + h * 0.58, 0,
                                      x + w / 2, y + h * 0.58, Math.max(w, h) * 0.62);
  glow.addColorStop(0, E.isToppled ? "rgba(243,200,119,0.22)" : "rgba(118,189,200,0.22)");
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.save();
  ctx.globalAlpha *= reveal;
  ctx.fillStyle = glow;
  ctx.fillRect(x - w * 0.18, y - h * 0.08, w * 1.36, h * 1.16);
  ctx.beginPath();
  ctx.rect(x - 2, y + h * (1 - reveal) - 2, w + 4, h * reveal + 4);
  ctx.clip();
  cardTower(x, y, w, h);
  ctx.restore();
}

/* A first attempt can topple before it earns points. Showing a huge zero there
   turns curiosity into failure, even though the player just made a tower move.
   Score is still the hero whenever it exists; otherwise the height of the run
   takes its place. */
function endCardCopy() {
  var scored = E.score > 0;
  var copy = {
    hero: String(scored ? E.score : E.towerHeight),
    support: scored ? E.towerHeight + " BOXES HIGH" : "BOXES HIGH",
    verdict: E.isToppled ? "TOWER TOPPLED" : "STILL STANDING",
    note: null,
    action: E.isToppled || HOST_WEB ? "BUILD AGAIN" : "BUILD HIGHER"
  };
  if (demoFinished()) {
    copy.verdict = "ALL " + CRATE_LIMIT + (CRATE_LIMIT === 1 ? " PIECE" : " PIECES") + " PLACED";
    copy.note = ["Want to keep building?", "Get the free app"];
    copy.action = "GET THE APP";
  }
  return copy;
}

/* **On a website, the fiftieth crate is the end of the demo, and the card says
   so.** A tower that falls short of it can be built again — they have not had
   the demo yet — but one that has placed every crate is told that more building
   is in the app, and its one action goes there instead of dealing another fifty. */
function demoFinished() { return HOST_WEB && G.endReason === "crate_limit"; }

/* The note's lines, each over as many more as [width] needs. */
function wrappedLines(lines, width) {
  var out = [];
  for (var i = 0; i < lines.length; i++) out = out.concat(wrapped(lines[i], width));
  return out;
}
function wrapped(text, width) {
  var words = text.split(" "), lines = [], line = "";
  for (var i = 0; i < words.length; i++) {
    var next = line ? line + " " + words[i] : words[i];
    if (line && ctx.measureText(next).width > width) { lines.push(line); line = words[i]; }
    else line = next;
  }
  if (line) lines.push(line);
  return lines;
}

/* The readout, stacked from the button up and centred in its box: the button is
   the fixed thing and the lines sit above it, so raising a type size moves the
   block rather than colliding with the score.

   **Nothing on it is under sixteen pixels.** The two supporting lines used to be
   set at a third of the score — eight pixels on a phone — which is unreadable,
   and they are the lines that say what happened. */
function cardText(x, y, w, h, copyReveal, buttonReveal) {
  var unit = Math.min(W, H), mid = x + w / 2;
  var small = Math.max(16, Math.round(unit * 0.042));
  var score = Math.round(unit * 0.125);
  var bh = Math.max(48, Math.min(64, h * 0.20));
  var copy = endCardCopy();
  // The note, when there is one, sits between the verdict and the button, on as
  // many lines as the card's width needs.
  ctx.font = "600 " + small + "px CP, system-ui, sans-serif";
  var note = copy.note ? wrappedLines(copy.note, w * 0.88) : [];
  var noteH = note.length ? small * (0.5 + note.length * 1.3) : 0;
  var blockH = bh + small * 4.7 + score * 1.05 + noteH;
  var by = y + (h - blockH) / 2 + blockH - bh;
  var verdictY = by - small * 1.3 - noteH;
  var heightY = verdictY - small * 1.8;
  var scoreY = heightY - small * 1.6;

  ctx.save();
  ctx.globalAlpha *= copyReveal;
  ctx.textAlign = "center";
  ctx.font = "700 " + score + "px CP, system-ui, sans-serif";
  ctx.fillStyle = C.ink;
  ctx.fillText(copy.hero, mid, scoreY);
  ctx.font = "600 " + small + "px CP, system-ui, sans-serif";
  ctx.fillStyle = C.inkDim;
  ctx.fillText(copy.support, mid, heightY);
  ctx.font = "700 " + small + "px CP, system-ui, sans-serif";
  ctx.fillStyle = E.isToppled ? C.craneLit : C.waterLine;
  ctx.fillText(copy.verdict, mid, verdictY);
  ctx.font = "600 " + small + "px CP, system-ui, sans-serif";
  ctx.fillStyle = C.ink;
  for (var i = 0; i < note.length; i++) ctx.fillText(note[i], mid, verdictY + small * (1.8 + i * 1.3));
  ctx.restore();

  var bw = Math.min(w * 0.92, 300), bx = mid - bw / 2;
  ctx.save();
  ctx.globalAlpha *= buttonReveal;
  var buttonScale = 0.94 + buttonReveal * 0.06;
  ctx.translate(mid, by + bh / 2);
  ctx.scale(buttonScale, buttonScale);
  ctx.translate(-mid, -(by + bh / 2));
  ctx.fillStyle = C.crane; rr(bx, by, bw, bh, 14); ctx.fill();
  ctx.fillStyle = C.onAction;
  ctx.font = "700 " + Math.round(bh * 0.40) + "px CP, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(copy.action, mid, by + bh / 2 + 1);
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.restore();
  if (buttonReveal > 0.65) G.endCtaButton = { x: bx, y: by, w: bw, h: bh };
}

/* **Two arrangements of the same three things.** Standing on a tall window, the
   tower sits over the readout; on a wide one it stands beside it. Stacking them
   in landscape left the tower thirteen pixels tall — a card 226 points high has
   nothing left after a score, two lines and a button. */
function drawEndCard() {
  G.endCtaButton = null;
  var cardP = ease(Math.min(1, G.endT / 0.42));
  var towerP = ease(Math.max(0, Math.min(1, (G.endT - 0.10) / 0.55)));
  var copyP = ease(Math.max(0, Math.min(1, (G.endT - 0.42) / 0.36)));
  var buttonP = ease(Math.max(0, Math.min(1, (G.endT - 0.68) / 0.28)));
  ctx.fillStyle = "rgba(5,7,12," + (0.88 * cardP) + ")";
  ctx.fillRect(0, 0, W, H);
  var wide = L.landscape;
  var cw = wide ? Math.min(W * 0.64, 520) : Math.min(W * 0.86, 420);
  var chh = wide ? Math.min(H * 0.84, 380) : Math.min(H * 0.68, 540);
  var cx = (W - cw) / 2, cy = (H - chh) / 2;
  G.endCard = { x: cx, y: cy, w: cw, h: chh };
  ctx.save();
  ctx.globalAlpha = cardP;
  var cardScale = 0.96 + cardP * 0.04;
  ctx.translate(cx + cw / 2, cy + chh / 2);
  ctx.scale(cardScale, cardScale);
  ctx.translate(-(cx + cw / 2), -(cy + chh / 2));
  ctx.fillStyle = C.panelRaised; rr(cx, cy, cw, chh, 22); ctx.fill();
  ctx.strokeStyle = C.frame; ctx.lineWidth = 2; rr(cx, cy, cw, chh, 22); ctx.stroke();

  var inset = Math.min(cw, chh) * 0.075;
  // At the crown, over both arrangements, as the score card puts it.
  var wm = readable(Math.round(Math.min(cw, chh) * 0.048));
  wordmark(cx + cw / 2, cy + inset + wm, wm);
  var top = cy + inset + wm * 1.9;
  if (wide) {
    var towerW = cw * 0.38;
    cardTowerMoment(cx + inset, top, towerW, cy + chh - inset - top, towerP);
    cardText(cx + inset * 1.35 + towerW, top, cw - inset * 2.35 - towerW,
             cy + chh - inset - top, copyP, buttonP);
  } else {
    // A card with a note gives its words a little more of the height.
    var split = cy + chh * (endCardCopy().note ? 0.40 : 0.50);
    cardTowerMoment(cx + cw * 0.20, top, cw * 0.60, split - top, towerP);
    cardText(cx, split, cw, cy + chh - inset - split, copyP, buttonP);
  }
  ctx.restore();
}

/* The wordmark over the board for a moment at the start. Gone by the time the
   ghost hand offers the lesson, and gone at once if they are quicker than that. */
function drawTitle() {
  if (!SHOW_TITLE || G.started || G.ended || G.fall) return;
  var a = Math.min(1, G.t / 0.22) * Math.max(0, Math.min(1, (1.45 - G.t) / 0.35));
  if (a <= 0) return;
  var size = Math.round(Math.min(W, H) * 0.085);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.shadowColor = "rgba(5,7,12,0.9)";
  ctx.shadowBlur = size * 0.55;
  wordmark(L.shaft.x + L.shaft.w / 2, L.fieldTop + L.shaft.h * 0.28, size);
  ctx.restore();
}

/* Two fixed utility berths. The mute never slides sideways when the CTA appears, and both
   retain a roughly 48-point hit area with input slop on the smallest supported phone. */
function utilitySize() { return Math.max(36, Math.min(44, Math.min(W, H) * 0.095)); }
function ctaWidth() {
  return CTA_STYLE === "icon" ? utilitySize() : Math.max(96, Math.min(116, Math.min(W, H) * 0.27));
}
function ctaX() { return W - 12 - ctaWidth(); }
function muteX() { return 12; }

/** The persistent way out: nobody should have to finish an advert first. */
function drawCta() {
  // The result has its own large install action. Keeping this one as well made
  // two controls compete for the same destination on the final impression.
  if (HOST_WEB || G.ended || G.t < CTA_FROM) { G.ctaButton = null; return; }
  var h = utilitySize(), w = ctaWidth(), x = ctaX(), y = 10;
  ctx.globalAlpha = 0.94;
  ctx.fillStyle = C.crane; rr(x, y, w, h, h / 2); ctx.fill();
  if (CTA_STYLE === "icon") {
    var cx = x + w / 2, cy = y + h / 2, k = h * 0.18;
    ctx.strokeStyle = C.onAction; ctx.lineWidth = Math.max(2.2, h * 0.065);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(cx - k, cy + k); ctx.lineTo(cx + k, cy - k);
    ctx.moveTo(cx, cy - k); ctx.lineTo(cx + k, cy - k); ctx.lineTo(cx + k, cy);
    ctx.stroke();
  } else {
    ctx.fillStyle = C.onAction;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 " + Math.round(readable(h * 0.39)) + "px CP, system-ui, sans-serif";
    ctx.fillText("INSTALL", x + w / 2, y + h / 2 + 1);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  G.ctaButton = { x: x, y: y, w: w, h: h };
}

/* The speaker, beside the way out and on the same terms.

   **An advert that starts making noise with no way to stop it is a worse advert
   than a silent one.** It is drawn from the first frame rather than once sound
   has started, so somebody in a quiet room can refuse it before it arrives; the
   network's own mute, where there is one, sits outside the creative and this
   does not fight it. */
function drawMute() {
  if (G.ended) { G.muteButton = null; return; }
  var s = utilitySize(), x = muteX(), y = 10;
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = C.panelRaised; rr(x, y, s, s, 8); ctx.fill();
  ctx.strokeStyle = C.frame; ctx.lineWidth = 1; rr(x, y, s, s, 8); ctx.stroke();
  var cx = x + s * 0.42, cy = y + s / 2, k = s * 0.15;
  ctx.fillStyle = muted ? C.inkDim : C.action;
  ctx.beginPath();
  ctx.moveTo(cx - k * 1.4, cy - k * 0.55);
  ctx.lineTo(cx - k * 0.5, cy - k * 0.55);
  ctx.lineTo(cx + k * 0.6, cy - k * 1.5);
  ctx.lineTo(cx + k * 0.6, cy + k * 1.5);
  ctx.lineTo(cx - k * 0.5, cy + k * 0.55);
  ctx.lineTo(cx - k * 1.4, cy + k * 0.55);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1.6;
  if (muted) {
    ctx.strokeStyle = C.barDanger;
    ctx.beginPath();
    ctx.moveTo(cx + k * 1.2, cy - k * 0.9);
    ctx.lineTo(cx + k * 2.4, cy + k * 0.9);
    ctx.moveTo(cx + k * 2.4, cy - k * 0.9);
    ctx.lineTo(cx + k * 1.2, cy + k * 0.9);
    ctx.stroke();
  } else {
    ctx.strokeStyle = C.action;
    for (var w = 1; w <= 2; w++) {
      ctx.beginPath();
      ctx.arc(cx + k * 0.6, cy, k * (0.7 + w * 0.62), -Math.PI / 3, Math.PI / 3);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  G.muteButton = { x: x, y: y, w: s, h: s };
}

/* Stable geometry for the browser visual gate. The harness should not need to
   reverse-engineer canvas pixels to answer whether controls overlap or leave
   the viewport; it reads the rectangles the renderer itself used. */
function debugRect(box) {
  return box ? { x: box.x, y: box.y, w: box.w, h: box.h } : null;
}
function debugLayoutRects() {
  return {
    viewport: { x: 0, y: 0, w: W, h: H },
    minTextPx: readable(0),
    minUtilityTouchPx: 36,
    landscape: L.landscape,
    gauge: debugRect(L.gauge),
    playfield: debugRect(L.shaft),
    crane: { x: L.beam.x, y: L.shaft.y - L.craneStrip, w: L.beam.w, h: L.craneStrip },
    score: debugRect(L.head),
    dealer: debugRect(L.tray),
    mute: debugRect(G.muteButton),
    install: debugRect(G.ctaButton),
    resultCard: debugRect(G.endCard),
    resultAction: debugRect(G.endCtaButton),
    resultActionLabel: G.ended ? endCardCopy().action : null
  };
}
function debugOpening() {
  // Tests deliberately redeal several openings in one page. Production deals
  // once, so invalidate the idle-coach cache here rather than complicating its
  // hot-path key with a debug-only generation.
  mimeCache = { generation: -1, hand: "", move: null };
  var move = bestMimeMove(), shape = move ? handShape(move.slot) : null;
  return {
    towerHeight: E.towerHeight,
    cameraBottom: cameraTopRow() - L.rows,
    cameraTop: cameraTopRow(),
    firstCargoRow: E.platformRows,
    completingRows: move ? E.projectedRows(move.slot, move.column) : 0,
    landingBottom: move ? move.landing : -1,
    landingTop: move && shape ? move.landing + shape.h : -1,
    hasCompletingMove: E.hasCompletingMove
  };
}
function debugCameraAim(slot, column) {
  var shape = handShape(slot), landing = shape ? E.landingY(slot, column) : -1;
  if (!shape || landing < 0) return null;
  var previous = G.carried;
  G.carried = {
    slot: slot, px: 0, py: L.fieldTop,
    anchorCellX: column, anchorFingerX: 0, returning: false
  };
  var top = cameraTopRow();
  G.carried = previous;
  return {
    cameraTop: top,
    landingTop: landing + shape.h,
    previewTopY: L.fieldTop + (top - landing - shape.h) * L.cell
  };
}
globalThis.BoxstackPlayableDebug = {
  layout: debugLayoutRects,
  opening: debugOpening,
  cameraAim: debugCameraAim
};

/* ---------------------------------------------------------------- play ----- */

function drop() {
  var c = G.carried; if (!c || G.falling) return;
  var sh = handShape(c.slot); if (!sh) { G.carried = null; return; }
  // Let go over the hand and it goes back, as in the game: a tap on a crate is
  // not a drop, and a change of mind costs nothing.
  if (c.returning) { G.carried = null; G.projected = null; return; }
  var col = aimedColumn();
  if (E.landingY(c.slot, col) < 0) { G.carried = null; return; }  // put back, no penalty
  G.falling = { shape: sh, slot: c.slot, x: col, to: E.landingY(c.slot, col),
                p: 0, y0: L.fieldTop, beforeLean: E.lean };
  G.carried = null; G.projected = null;
}
function land() {
  var f = G.falling;
  G.falling = null;
  var rows = E.place(f.slot, f.x);
  if (rows < 0) return;
  report("placement", { completedRows: rows });
  if (rows > 0) report("row", { completedRows: rows, combo: E.combo });
  cuePlacement(rows, E.combo);
  var firstSafe = E.placedCount === 1 && !E.isToppled;
  G.shake = rows ? 0.72 : (firstSafe ? 0.52 : 0.3);
  if (rows) G.flash = { rows: Array.from(E.rowsJustSet()), p: 0 };
  if (Math.abs(E.lean) <= 0.06) G.sweep = 1;
  if (firstSafe || rows > 0) {
    G.reward = {
      p: 0, first: firstSafe, rows: rows, gain: E.scoreJustGained,
      shape: f.shape, column: f.x, landing: f.to,
      beforeLean: f.beforeLean, afterLean: E.lean,
      recovered: Math.max(0, Math.abs(f.beforeLean) - Math.abs(E.lean))
    };
  }
  shapeCache = [null, null, null];
  if (E.isToppled) { startFall(false, "topple"); return; }
  if (ENDS_ON === "crates" && E.placedCount >= CRATE_LIMIT) startFall(true, "crate_limit");
}

var last = 0;
function frame(now) {
  var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  G.t += dt;
  if (!G.ended) G.runT += dt;
  if (G.ended) G.endT += dt;
  if (!G.carried && !G.falling && !G.ended) G.idle += dt;
  // The game's own drop: release to touchdown in `PlayfieldAnim.CONTACT_MS`. It
  // was nearly twice that here, and the next crate cannot be picked up until
  // this one has landed.
  if (G.falling) { G.falling.p += dt * 1000 / E.contactMs; if (G.falling.p >= 1) land(); }
  stepView(dt);
  if (G.flash) { G.flash.p += dt * 1.7; if (G.flash.p >= 1) G.flash = null; }
  if (G.reward) { G.reward.p += dt / 1.25; if (G.reward.p >= 1) G.reward = null; }
  if (G.sweep > 0) G.sweep = Math.max(0, G.sweep - dt * 1.55);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.9);
  G.shownLean += (E.lean - G.shownLean) * Math.min(1, dt * 7);
  G.shownScore += (E.score - G.shownScore) * Math.min(1, dt * 6);
  if (G.fall && !G.ended) stepFall(dt);
  if (G.started && !G.ended && !G.fall) {
    G.clock += dt;
    // Never take the run away between release and landing: that loses a placement
    // already made. The safety limit is invisible and ends on the intact tower.
    var limit = ENDS_ON === "time" ? TIME_LIMIT : (ENDS_ON === "loss" ? SAFETY_LIMIT : Infinity);
    if (G.clock >= limit && !G.carried && !G.falling) {
      startFall(true, ENDS_ON === "loss" ? "safety" : "time_limit");
    }
  }
  // A stranger who never touched it: end it rather than leave the tab spinning.
  // Not on a website, where the demo waits on a page somebody may still be
  // reading, and ending it there would greet them with a result they never played.
  if (!HOST_WEB && !G.started && !G.ended && !G.fall && G.runT > SAFETY_LIMIT) startFall(true, "idle");

  if (cvs.clientWidth !== lastW || cvs.clientHeight !== lastH) {
    lastW = cvs.clientWidth; lastH = cvs.clientHeight; layout();
  }

  drawNight();
  drawShaftGround();
  ctx.save();
  clipToShaft();
  if (G.shake > 0) {
    var k = G.shake * L.cell * 0.13;
    ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k * 0.6);
  }
  drawWater();
  if (G.fall) { drawFall(); } else { drawPlatform(); drawBoard(); drawPlacementReward(); }
  ctx.restore();
  drawFrame();

  drawGantry();
  drawFalling();
  drawCarried();
  drawGauge();
  drawHead();
  drawTray();
  drawMime();
  drawTitle();
  if (G.ended) drawEndCard();
  drawCta();
  drawMute();

  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- input ----- */

function pointAt(e) {
  var t = e.touches && e.touches.length ? e.touches[0] : e;
  var r = cvs.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function inBox(box, p, slop) {
  slop = slop || 0;
  return box && p.x >= box.x - slop && p.x <= box.x + box.w + slop &&
         p.y >= box.y - slop && p.y <= box.y + box.h + slop;
}
function aim() {
  if (!G.carried) { G.projected = null; return; }
  var v = E.projectedLean(G.carried.slot, aimedColumn());
  G.projected = isNaN(v) ? null : v;
}
function down(e) {
  // In an ad the creative owns every touch. On a website it takes only the ones that land on
  // something, so a visitor can scroll past it.
  var take = function () { e.preventDefault(); };
  if (!HOST_WEB) take();
  var p = pointAt(e);
  // Before everything, including the end card's whole-screen tap: a speaker the
  // player cannot reach once the run is over is not a control.
  if (inBox(G.muteButton, p, 6)) { take(); muted = !muted; wakeAudio(); return; }
  if (inBox(G.ctaButton, p, 6)) { take(); openStore("persistent"); return; }
  if (G.ended) {
    if (inBox(G.endCtaButton, p, 8)) {
      take();
      if (HOST_WEB && !demoFinished()) buildAgain(); else openStore("result");
    }
    return;
  }
  // The run is over the moment the tower lets go: without this the tray stayed
  // live through the collapse and crates could be dropped into a falling tower.
  if (G.fall || G.falling) return;
  for (var i = 0; i < E.handSize; i++) {
    if (E.handOrdinal(i) >= 0 && inBox(traySlot(i), p, 8)) {
      take();
      wakeAudio();
      if (!G.started) report("first_interaction");
      G.started = true;
      G.idle = 0;
      G.fling = 0;
      G.carried = { slot: i, px: p.x, py: p.y, anchorCellX: startCellX(i), anchorFingerX: p.x,
                    returning: overHand(p) };
      cue("pickup");
      aim();
      return;
    }
  }
  if (inBox(L.shaft, p) && (!HOST_WEB || towerHidden())) {
    take();
    beginScroll(p);
  }
}
function move(e) {
  if (G.scroll) {
    e.preventDefault();
    moveScroll(pointAt(e));
    return;
  }
  if (!G.carried) return;
  e.preventDefault();
  var p = pointAt(e);
  var c = G.carried, sh = handShape(c.slot);
  c.px = p.x; c.py = p.y;
  // Past either end the crane stops, and the grab point moves with the finger,
  // so turning back moves the crate at once rather than after a dead stretch.
  // `GameInteraction.carryTo`.
  if (sh) {
    var wanted = carriedCellX(c), rightmost = E.boardWidth - sh.w;
    if (wanted < 0) c.anchorCellX -= wanted;
    if (wanted > rightmost) c.anchorCellX -= wanted - rightmost;
  }
  c.returning = overHand(p);
  G.idle = 0;
  aim();
}
function up(e) {
  if (G.scroll) {
    e.preventDefault();
    endScroll();
    return;
  }
  if (!G.carried) return;
  e.preventDefault();
  drop();
}

/* ------------------------------------------------------------- scrolling -----
   A drag in the shaft with nothing in hand moves the view down the tower and
   back, as in the game: the finger's pixels are the tower's pixels, and it has
   to pull a fingertip's width (`TOWER_DETACH_SLOP_DP`) before it lets go of the
   summit, because a few pixels is what a tap wanders. Let go moving and it
   coasts. Where the view is kept is the engine's `TowerViewport`.

   **On a website the shaft takes a touch only when there is tower out of view**
   (or the view is already off the summit): until then a finger on it scrolls the
   page, which is what someone scrolling past the demo means by it. */
function towerHidden() {
  var summit = G.summitTop === null ? cameraTopRow() : G.summitTop;
  return !E.viewFollowsTop || summit - L.rows > E.platformRows + 0.01;
}
function beginScroll(p) {
  G.fling = 0;
  G.scroll = { y: p.y, pull: 0, engaged: false, t: performance.now(), v: 0 };
}
function moveScroll(p) {
  var sc = G.scroll, dy = p.y - sc.y;
  sc.y = p.y;
  if (!sc.engaged) {
    sc.pull += dy;
    var slop = E.towerDetachSlop;
    if (Math.abs(sc.pull) < slop) return;
    sc.engaged = true;
    dy = sc.pull - (sc.pull < 0 ? -slop : slop);
  }
  var rows = dy / L.cell;
  E.scrollView(rows, G.summitTop - L.rows, L.rows);
  var now = performance.now(), dt = Math.max(0.008, (now - sc.t) / 1000);
  sc.v = sc.v * 0.6 + (rows / dt) * 0.4;
  sc.t = now;
  G.idle = 0;
}
function endScroll() {
  var sc = G.scroll;
  G.scroll = null;
  // A finger that stopped before letting go has nothing to coast on.
  if (sc.engaged && performance.now() - sc.t < 90 && Math.abs(sc.v) > 2) {
    G.fling = Math.max(-60, Math.min(60, sc.v));
  }
}
/* The automatic camera eases toward where it should be, and a released scroll
   coasts down to a stop — or to the summit, where the view takes up following
   it again. */
function stepView(dt) {
  var target = cameraTopRow();
  if (G.summitTop === null) G.summitTop = target;
  G.summitTop += (target - G.summitTop) * Math.min(1, dt * 10);
  if (Math.abs(target - G.summitTop) < 0.002) G.summitTop = target;
  if (G.fling && !G.scroll) {
    E.scrollView(G.fling * dt, G.summitTop - L.rows, L.rows);
    G.fling *= Math.exp(-dt * 4.5);
    if (Math.abs(G.fling) < 0.3 || E.viewFollowsTop) G.fling = 0;
  }
}
// Decoding takes a few milliseconds and the first touch cannot wait for it.
startAudio();

cvs.addEventListener("touchstart", down, { passive: false });
cvs.addEventListener("touchmove", move, { passive: false });
cvs.addEventListener("touchend", up, { passive: false });
cvs.addEventListener("touchcancel", up, { passive: false });
cvs.addEventListener("mousedown", down);
window.addEventListener("mousemove", move);
window.addEventListener("mouseup", up);
window.addEventListener("resize", layout);

/* ----------------------------------------------------------------- cta -----
   Every network has its own hook and they change. Feature-detect, putting the
   network's own call ahead of the generic fallback.                           */

/** On a website the result action deals a new tower: a fresh load seeds from the clock. */
function buildAgain() {
  report("replay");
  location.reload();
}

var ctaFired = false;
function openStore(source) {
  if (ctaFired) return;
  ctaFired = true;
  report("cta", { source: source || "unknown", destination: "store" });
  try { if (window.FbPlayableAd && FbPlayableAd.onCTAClick) { FbPlayableAd.onCTAClick(); return; } } catch (err) {}
  try { if (window.mraid && mraid.open) { mraid.open(STORE_URL); return; } } catch (err) {}
  try { if (window.ExitApi && ExitApi.exit) { ExitApi.exit(); return; } } catch (err) {}
  try { if (window.gameEnd) { window.gameEnd(); return; } } catch (err) {}
  try { window.open(STORE_URL, "_blank"); } catch (err) {}
  setTimeout(function () { ctaFired = false; }, 900);
}

layout();
setTimeout(function () { report("ready"); }, 0);
requestAnimationFrame(frame);
</script>
</body>
</html>
