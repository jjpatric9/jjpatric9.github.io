<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120e0b">
<title>Pong — TallmanGames</title>
<meta name="description" content="Classic Pong on a 1970s TV, played with rotary paddle controllers: eight games, one or two players. Free in your browser, made for Android phones.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face {
  font-family: "Chakra Petch";
  src: url("../fonts/chakra-petch-bold.woff2") format("woff2");
  font-weight: 700;
  font-display: swap;
}

:root {
  --gap: 10px;
  --wood:
    repeating-linear-gradient(91deg, rgba(0,0,0,.16) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(89.3deg, rgba(255,214,160,.07) 0 2px, transparent 2px 17px),
    repeating-linear-gradient(90.6deg, rgba(40,16,4,.22) 0 3px, transparent 3px 29px),
    linear-gradient(180deg, #8a5530, #6a3d1e 45%, #4f2c14);
  --label: #e8d9bd;
  --chrome: linear-gradient(180deg, #f4f4f2, #9c9c98 48%, #e6e6e2 52%, #8a8a86);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: #120e0b;
}

body {
  font-family: "Chakra Petch", system-ui, sans-serif;
  font-weight: 700;
  color: var(--label);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a211a, transparent 70%),
    #120e0b;
}

.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  padding:
    calc(env(safe-area-inset-top) + var(--gap))
    calc(env(safe-area-inset-right) + var(--gap))
    calc(env(safe-area-inset-bottom) + var(--gap))
    calc(env(safe-area-inset-left) + var(--gap));
}

/* ───────────── The television ───────────── */

.tv {
  flex: none;
  width: 100%;
  max-width: calc(56dvh * 4 / 3 + 40px);
  margin: 0 auto;
  padding: 12px 12px 0;
  border-radius: 20px;
  background: var(--wood);
  box-shadow:
    inset 0 2px 0 rgba(255,220,180,.25),
    inset 0 -3px 0 rgba(0,0,0,.35),
    0 14px 30px rgba(0,0,0,.6);
}

.bezel {
  padding: 10px;
  border-radius: 16px;
  background: linear-gradient(160deg, #3a3631, #1b1916 60%, #252220);
  box-shadow:
    inset 0 0 0 2px #0b0a09,
    inset 0 3px 8px rgba(0,0,0,.8),
    0 1px 0 rgba(255,230,200,.18);
}

.screen {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 9% / 12%;
  overflow: hidden;
  background: #070908;
  box-shadow: 0 0 0 3px #050505, 0 0 18px rgba(170,210,255,.08);
}

.screen canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Scanlines and a faint shadow-mask flicker */
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.34) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
  animation: flicker 4.5s steps(60) infinite;
}

/* Curved glass: vignette, edge darkening and a soft reflection */
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background:
    radial-gradient(70% 45% at 30% 12%, rgba(255,255,255,.07), transparent 70%),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  box-shadow:
    inset 0 0 40px rgba(0,0,0,.85),
    inset 0 0 6px rgba(0,0,0,.9);
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: .9; }
  51% { opacity: 1; }
  77% { opacity: .95; }
}

.tv-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 4px 9px;
}

.brand {
  font-size: 15px;
  letter-spacing: .28em;
  background: var(--chrome);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.6));
  white-space: nowrap;
}

.tv-knobs { display: flex; gap: 8px; align-items: center; }

.tv-knobs i {
  display: block;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background:
    linear-gradient(90deg, transparent 45%, #d8d2c6 45% 55%, transparent 55%) center / 100% 60% no-repeat,
    radial-gradient(circle at 40% 35%, #3b3733, #0d0c0b 70%);
  box-shadow: 0 2px 3px rgba(0,0,0,.6), 0 0 0 2px #2a1709;
}
.tv-knobs i:nth-of-type(2) { transform: rotate(55deg); }

.tv-knobs b {
  width: 6px;
  height: 6px;
  margin-left: 4px;
  border-radius: 50%;
  background: #ff3b20;
  box-shadow: 0 0 6px #ff3b20, 0 0 2px #ffb09f inset;
}

/* ───────────── The controller ───────────── */

.pad {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  border-radius: 22px 22px 34px 34px;
  background:
    radial-gradient(130% 70% at 50% -10%, rgba(255,255,255,.08), transparent 60%),
    repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #1f1d1b, #121110);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.08),
    inset 0 -4px 0 rgba(0,0,0,.6),
    0 16px 28px rgba(0,0,0,.65);
  overflow: hidden;
}

.strip {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px 9px;
  background: var(--wood);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,220,180,.18);
}

.title {
  min-width: 0;
  font-size: 13px;
  line-height: 1.15;
  letter-spacing: .16em;
  color: var(--label);
  text-shadow: 0 1px 0 rgba(0,0,0,.6);
}
.title small {
  display: block;
  font-size: 10px;
  letter-spacing: .3em;
  opacity: .7;
}

.switches { flex: none; display: flex; gap: 12px; align-items: flex-start; }

.switch {
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: var(--label);
  font-size: 10px;
  letter-spacing: .12em;
  cursor: pointer;
}

.switch:focus-visible { outline: 2px solid #ffd27a; outline-offset: 3px; border-radius: 4px; }

.switch .slot {
  position: relative;
  width: 18px;
  height: 30px;
  border-radius: 4px;
  background: linear-gradient(90deg, #070605, #1d1a17 50%, #070605);
  box-shadow: inset 0 1px 3px #000, 0 1px 0 rgba(255,220,180,.25);
}

.switch .lever {
  position: absolute;
  left: 2px;
  right: 2px;
  top: 2px;
  height: 14px;
  border-radius: 3px;
  background: linear-gradient(180deg, #4a4642, #1a1816);
  box-shadow: 0 2px 2px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.2);
  transition: top .09s ease-out;
}
.switch[aria-checked="false"] .lever { top: 14px; }

/* GAME SELECT is a spring-loaded switch: it rests in the middle and dips when pushed */
.switch.momentary .lever { top: 8px; background: linear-gradient(180deg, #8a8580, #3a3632); }
.switch.momentary.down .lever { top: 14px; }

.switch .marks { display: flex; gap: 6px; opacity: .85; }
/* Which player a difficulty switch belongs to, as on the console's LEFT and RIGHT DIFFICULTY */
.switch .side { margin-top: -1px; font-size: 8px; line-height: 1; letter-spacing: .14em; opacity: .6; }
.switch .marks span { opacity: .45; }
.switch.momentary .marks span,
.switch[aria-checked="true"] .marks span:first-child,
.switch[aria-checked="false"] .marks span:last-child { opacity: 1; }

.deck {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding: 6px 10px 14px;
  --k: min(42vw, 30dvh, 250px);
  --fk: calc(var(--k) * .72);
}

.cluster {
  min-height: 0;
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  align-items: center;
  justify-items: center;
}

.deck[data-players="1"] .cluster[data-p="1"] { display: none; }

/* Two players: a knob and a button each, like the console with both controllers plugged in */
.deck[data-players="2"] {
  grid-template-columns: 1fr 1fr;
  --k: min(34vw, 17dvh, 200px);
  --fk: calc(var(--k) * .5);
}
.deck[data-players="2"] .cluster {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr auto;
}
.deck[data-players="2"] .fire-zone { height: calc(var(--fk) + 34px); }

/* Rotary paddle knob */
.knob-zone {
  --r: calc(var(--k) * .61);
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  cursor: grab;
  touch-action: none;
}
.knob-zone:active { cursor: grabbing; }
.knob-zone:focus-visible { outline: none; }
.knob-zone:focus-visible .knob { outline: 3px solid #ffd27a; outline-offset: 10px; border-radius: 50%; }

.dial {
  position: absolute;
  width: calc(var(--k) * 1.22);
  height: calc(var(--k) * 1.22);
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  pointer-events: none;
}

.knob {
  position: relative;
  width: var(--k);
  height: var(--k);
  border-radius: 50%;
  pointer-events: none;
  filter: drop-shadow(0 10px 10px rgba(0,0,0,.7));
}

.knob .rot {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  will-change: transform;
}

.knob .skirt {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    repeating-conic-gradient(#2c2a28 0 4deg, #090808 4deg 8deg);
  box-shadow: 0 0 0 3px #0a0908, inset 0 0 0 2px rgba(255,255,255,.05);
}

.knob .face {
  position: absolute;
  inset: 13%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #1d1b1a, #0b0a0a 70%);
  box-shadow:
    0 0 0 2px #050505,
    inset 0 2px 3px rgba(255,255,255,.12),
    inset 0 -3px 6px rgba(0,0,0,.8);
}

.knob .face::before {
  /* the white pointer line */
  content: "";
  position: absolute;
  left: 50%;
  top: 6%;
  width: 7%;
  height: 34%;
  translate: -50% 0;
  border-radius: 99px;
  background: #ece6d8;
  box-shadow: 0 0 2px rgba(0,0,0,.6);
}

.knob .face::after {
  /* the chrome hub */
  content: "";
  position: absolute;
  inset: 34%;
  border-radius: 50%;
  background: conic-gradient(from 20deg, #d9d9d6, #7d7d79, #f2f2ef, #8c8c88, #d9d9d6, #6f6f6b, #e9e9e6, #8a8a86, #d9d9d6);
  box-shadow: 0 0 0 2px #050505, 0 2px 3px rgba(0,0,0,.6);
}

/* SLIDE style: the same knob riding a straight groove, up and down or side to side */
.slider {
  --t: min(64px, calc(var(--k) * .36));
  position: absolute;
  inset: 4px 0 26px;
  display: none;
  place-items: center;
  pointer-events: none;
}
.slider.v { padding: calc(var(--t) / 2) 0; }
.slider.h { padding: 0 calc(var(--t) / 2 + 6px); }

.track {
  position: relative;
  border-radius: 99px;
  background: linear-gradient(90deg, #050404, #1a1715 50%, #050404);
  box-shadow: inset 0 2px 4px #000, 0 1px 0 rgba(255,255,255,.07);
}
.slider.v .track { width: 14px; height: 100%; }
.slider.h .track { height: 14px; width: 100%; background: linear-gradient(180deg, #050404, #1a1715 50%, #050404); }

/* Painted scale beside the groove */
.track::before {
  content: "";
  position: absolute;
  opacity: .5;
}
.slider.v .track::before {
  left: calc(100% + 10px);
  top: 0;
  bottom: 0;
  width: 10px;
  background: repeating-linear-gradient(180deg, var(--label) 0 2px, transparent 2px 10%) top / 100% calc(100% + 2px);
}
.slider.h .track::before {
  top: calc(100% + 10px);
  left: 0;
  right: 0;
  height: 10px;
  background: repeating-linear-gradient(90deg, var(--label) 0 2px, transparent 2px 10%) left / calc(100% + 2px) 100%;
}

.thumb {
  position: absolute;
  width: var(--t);
  height: var(--t);
  border-radius: 50%;
  translate: -50% -50%;
  background:
    radial-gradient(circle, #8f8f8b 0 17%, #050505 18% 21%, transparent 22%),
    radial-gradient(circle at 50% 40%, #2a2826, #0b0a0a 60%) center / 74% 74% no-repeat,
    repeating-conic-gradient(#2c2a28 0 6deg, #090808 6deg 12deg);
  box-shadow: 0 0 0 3px #0a0908, 0 8px 12px rgba(0,0,0,.7);
}
.thumb::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 26%, rgba(255,255,255,.22), transparent 40%);
}
.slider.v .thumb { left: 50%; top: calc(var(--u) * 100%); }
.slider.h .thumb { top: 50%; left: calc(var(--u) * 100%); }

.deck[data-style="slide"] .slider { display: grid; }
.deck[data-style="slide"] .knob,
.deck[data-style="slide"] .dial { display: none; }
.deck[data-style="slide"] .knob-zone .cap { top: auto; bottom: 2px; }

/* Two players sliding up and down: each groove runs the full height of its half, its button beside it */
.deck[data-players="2"][data-style="slide"][data-axis="v"] .cluster {
  grid-template-columns: 1fr auto;
  grid-template-rows: 1fr;
}
.deck[data-players="2"][data-style="slide"][data-axis="v"] .fire-zone {
  width: calc(var(--fk) + 16px);
  height: 100%;
}
.deck[data-players="2"][data-style="slide"][data-axis="v"] .fire-zone .cap { top: calc(50% + var(--r) + 6px); bottom: auto; }

.knob .shine {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at 34% 26%, rgba(255,255,255,.22), transparent 38%),
    radial-gradient(circle at 70% 85%, rgba(0,0,0,.35), transparent 50%);
}

.cap {
  position: absolute;
  top: calc(50% + var(--r) + 6px);
  left: 0;
  right: 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: .25em;
  opacity: .7;
  white-space: nowrap;
  pointer-events: none;
}

/* Big red fire button */
.fire-zone {
  --r: calc(var(--fk) / 2);
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
}
.deck[data-players="2"] .fire-zone .cap { top: auto; bottom: 2px; }

.fire-ring {
  width: var(--fk);
  height: var(--fk);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(from 210deg, #6f6f6b, #e8e8e5, #6f6f6b, #cfcfcb, #6f6f6b);
  box-shadow: 0 6px 12px rgba(0,0,0,.7), inset 0 0 0 3px #111;
}

.fire {
  width: 80%;
  height: 80%;
  border: 0;
  padding: 0;
  border-radius: 50%;
  cursor: pointer;
  touch-action: none;
  background: radial-gradient(circle at 40% 32%, #ff8a72, #e3261a 42%, #9d0d07 80%);
  box-shadow:
    0 7px 0 #5b0603,
    0 9px 6px rgba(0,0,0,.6),
    inset 0 -4px 8px rgba(80,0,0,.6),
    inset 0 3px 2px rgba(255,200,190,.5);
  translate: 0 -6px;
  transition: translate .05s, box-shadow .05s;
}

.fire.down {
  translate: 0 0;
  box-shadow:
    0 1px 0 #5b0603,
    0 2px 3px rgba(0,0,0,.6),
    inset 0 -2px 6px rgba(80,0,0,.6),
    inset 0 3px 3px rgba(255,200,190,.35);
}

.fire:focus-visible { outline: 3px solid #ffd27a; outline-offset: 6px; }

.full {
  width: 34px;
  height: 22px;
  border: 0;
  border-radius: 5px;
  background: linear-gradient(180deg, #34312d, #161412);
  box-shadow: 0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.12);
  color: var(--label);
  font: inherit;
  font-size: 9px;
  letter-spacing: .1em;
  cursor: pointer;
}

@media (max-width: 430px) {
  .strip { padding-inline: 12px; }
  .switches { gap: 9px; }
  .switch { letter-spacing: .06em; }
  .title { font-size: 12px; letter-spacing: .12em; }
  .title span { display: block; }
  .title small { display: none; }
}

@media (max-width: 380px) {
  .title { display: none; }
  .strip { justify-content: center; }
  .switches { gap: 8px; }
}

/* Landscape phone: TV on the left, controller on the right */
@media (orientation: landscape) and (max-height: 700px) {
  .app { flex-direction: row; }
  /* The screen is sized from the height: app padding, TV padding, bezel and foot take 84px */
  .app { --screen-h: calc(100dvh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .tv { flex: none; width: auto; max-width: none; margin: 0; align-self: center; }
  .screen { height: var(--screen-h); width: calc(var(--screen-h) * 4 / 3); }
  .pad { max-width: none; }
  .deck { --k: min(17vw, 36dvh, 230px); }
  .cluster { grid-template-columns: 1.2fr 1fr; }
  .deck[data-players="2"] { --k: min(11vw, 34dvh, 160px); --fk: calc(var(--k) * .6); }
  .deck[data-players="2"] .cluster { grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr; }
  .deck[data-players="2"] .fire-zone { height: 100%; }
  .deck[data-players="2"] .fire-zone .cap { top: calc(50% + var(--r) + 6px); bottom: auto; }
  .tv-foot { height: 30px; padding: 0 4px; }
  .brand { font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .screen::before { animation: none; }
}
</style>
</head>
<body>
<main class="app">
  <section class="tv" aria-label="Television">
    <div class="bezel">
      <div class="screen"><canvas id="crt" aria-label="Pong game screen"></canvas></div>
    </div>
    <div class="tv-foot">
      <span class="brand">TALLMAN</span>
      <span class="tv-knobs"><button class="full" id="full" aria-label="Full screen">FULL</button><i aria-hidden="true"></i><i aria-hidden="true"></i><b aria-hidden="true"></b></span>
    </div>
  </section>

  <section class="pad" aria-label="Controller">
    <div class="strip">
      <div class="title"><span>VIDEO</span> <span>PONG</span><small>PADDLE CONTROLLER</small></div>
      <div class="switches">
        <button class="switch momentary" id="gameBtn" aria-label="Game select">
          <span class="slot"><span class="lever"></span></span>
          <span class="marks"><span>GAME</span></span>
        </button>
        <button class="switch" id="plyr" role="switch" aria-checked="true" aria-label="Players: on is one player, off is two">
          <span class="slot"><span class="lever"></span></span>
          <span class="marks"><span>1P</span><span>2P</span></span>
        </button>
        <button class="switch" id="style" role="switch" aria-checked="true" aria-label="Controls: on turns the knob, off slides it">
          <span class="slot"><span class="lever"></span></span>
          <span class="marks"><span>DIAL</span><span>SLIDE</span></span>
        </button>
        <button class="switch" id="diffL" role="switch" aria-checked="false" aria-label="Left difficulty: A makes the left paddle half size">
          <span class="slot"><span class="lever"></span></span>
          <span class="marks"><span>A</span><span>B</span></span>
          <span class="side">LEFT</span>
        </button>
        <button class="switch" id="diffR" role="switch" aria-checked="false" aria-label="Right difficulty: A makes the right paddle half size">
          <span class="slot"><span class="lever"></span></span>
          <span class="marks"><span>A</span><span>B</span></span>
          <span class="side">RIGHT</span>
        </button>
        <button class="switch" id="snd" role="switch" aria-checked="true" aria-label="Sound">
          <span class="slot"><span class="lever"></span></span>
          <span class="marks"><span>ON</span><span>OFF</span></span>
        </button>
      </div>
    </div>

    <div class="deck" id="deck" data-players="1" data-style="dial">
      <div class="cluster" data-p="0">
        <div class="knob-zone" id="zone0" role="slider" tabindex="0" aria-label="Left player's paddle knob" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
          <svg class="dial" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
          <div class="knob"><div class="rot"><div class="skirt"></div><div class="face"></div></div><div class="shine"></div></div>
          <div class="slider v" aria-hidden="true"><div class="track"><div class="thumb"></div></div></div>
          <span class="cap" data-cap="knob">TURN</span>
        </div>
        <div class="fire-zone">
          <div class="fire-ring"><button class="fire" id="fire0" aria-label="Serve"></button></div>
          <span class="cap" data-cap="fire">SERVE</span>
        </div>
      </div>
      <div class="cluster" data-p="1">
        <div class="knob-zone" id="zone1" role="slider" tabindex="0" aria-label="Right player's paddle knob" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
          <svg class="dial" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
          <div class="knob"><div class="rot"><div class="skirt"></div><div class="face"></div></div><div class="shine"></div></div>
          <div class="slider v" aria-hidden="true"><div class="track"><div class="thumb"></div></div></div>
          <span class="cap" data-cap="knob">P2</span>
        </div>
        <div class="fire-zone">
          <div class="fire-ring"><button class="fire" id="fire1" aria-label="Player 2 serve"></button></div>
          <span class="cap" data-cap="fire">SERVE</span>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  // ───────────── Settings ─────────────
  const store = {
    get(k, d) { try { const v = localStorage.getItem("pong." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("pong." + k, JSON.stringify(v)); } catch {} },
  };
  // The console's two difficulty switches: A gives that side's player a half-size paddle
  const diffA = [!!store.get("diffL", false), !!store.get("diffR", false)];
  let soundOn = true; // every visit starts with sound on; the switch lasts for this visit only
  let players = store.get("players", 1) === 2 ? 2 : 1;
  let slide = !!store.get("slide", false);
  let gameNo = 0;

  // Ball speed steps up after the 4th and 12th return of a volley, as the arcade circuit did
  const LEVEL = { speeds: [110, 150, 200], cpuSpeed: 95, aimErr: 12, react: 150, whiff: 0.1, vSpeed: 205, gravity: 160 };
  const level = () => LEVEL;

  // ───────────── Sound: square-wave blips like the original ─────────────
  let ac = null;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function beep(freq, dur, always) {
    if (!soundOn || !ac || (game.demo && !always)) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.11, t + 0.003);
    g.gain.setValueAtTime(0.11, t + dur);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.008);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const SFX = {
    paddle: () => beep(459, 0.034),
    wall: () => beep(226, 0.017),
    score: () => beep(490, 0.257),
    click: () => beep(1200, 0.006, true),
  };
  const buzz = (ms) => { if (!game.demo && navigator.vibrate) try { navigator.vibrate(ms); } catch {} };

  // ───────────── Field (in TV pixels) ─────────────
  const W = 256, H = 192;
  const BALL = 4, PT = 4, PL = 24;
  const PHOSPHOR = "#eaf3ff";
  const DEG = Math.PI / 180;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // 3×5 bitmap font, rows top to bottom
  const FONT = {
    "0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111",
    "4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001001001001",
    "8":"111101111101111","9":"111101111001111",
    A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",
    E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",
    I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
    M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",
    Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
    U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",
    Y:"101101010010010",Z:"111001010100111","!":"010010010000010","-":"000000111000000",
    " ":"000000000000000",
  };

  // A paddle belongs to an owner (a knob or the computer) and slides along one axis.
  // `segs` lets one knob drive a rod of several paddles, as in table soccer.
  function pad(owner, axis, at, normal, len, segs, from, to) {
    return { owner, axis, at, normal, len, segs, lo: from, hi: to - len - segs[segs.length - 1] };
  }
  const vpad = (owner, x, normal, o = {}) => pad(owner, "y", x, normal, o.len || PL, o.segs || [0], o.from ?? 0, o.to ?? H);
  const hpad = (owner, y, normal, o = {}) => pad(owner, "x", y, normal, o.len || PL, o.segs || [0], o.from ?? 0, o.to ?? W);
  const R = (x, y, w, h) => ({ x, y, w, h });
  const IN = { from: 3, to: H - 3 };
  const rink = (gap) => [
    R(0, 0, W, 3), R(0, H - 3, W, 3),
    R(0, 0, 3, H / 2 - gap), R(0, H / 2 + gap, 3, H / 2 - gap),
    R(W - 3, 0, 3, H / 2 - gap), R(W - 3, H / 2 + gap, 3, H / 2 - gap),
  ];
  function quadWalls(g) {
    const w = [R(0, 0, 16, 16), R(W - 16, 0, 16, 16), R(0, H - 16, 16, 16), R(W - 16, H - 16, 16, 16)];
    if (g.out[0]) w.push(R(0, 0, 3, H));
    if (g.out[1]) w.push(R(W - 3, 0, 3, H));
    if (g.out[2]) w.push(R(0, 0, W, 3));
    if (g.out[3]) w.push(R(0, H - 3, W, 3));
    return w;
  }

  // Which team concedes when the ball leaves by each edge; "bounce" is an invisible wall
  const EDGES = { top: "bounce", bottom: "bounce", left: 0, right: 1 };

  const MODES = [
    { name: "PONG", net: true,
      pads: () => [vpad(0, 14, 1), vpad(1, W - 18, -1)] },
    { name: "CATCH", net: true, catch: true,
      pads: () => [vpad(0, 14, 1), vpad(1, W - 18, -1)] },
    { name: "DOUBLES", net: true, team: [0, 1, 0, 1],
      pads: () => [vpad(0, 14, 1), vpad(1, W - 18, -1), vpad(2, 76, 1), vpad(3, W - 80, -1)] },
    { name: "HOCKEY", net: true, walls: () => rink(28),
      pads: () => [vpad(0, 12, 1, IN), vpad(0, 160, 1, IN), vpad(1, W - 16, -1, IN), vpad(1, W - 164, -1, IN)] },
    { name: "SOCCER", net: true, walls: () => rink(32),
      pads: () => [
        vpad(0, 16, 1, { ...IN, len: 20 }), vpad(0, 66, 1, { ...IN, len: 16, segs: [0, 64] }), vpad(0, 150, 1, { ...IN, len: 12, segs: [0, 48, 96] }),
        vpad(1, W - 20, -1, { ...IN, len: 20 }), vpad(1, W - 70, -1, { ...IN, len: 16, segs: [0, 64] }), vpad(1, W - 154, -1, { ...IN, len: 12, segs: [0, 48, 96] }),
      ] },
    { name: "HANDBALL", turns: true, edges: { left: "turn", right: "bounce" },
      walls: () => [R(0, 0, W, 3), R(0, H - 3, W, 3), R(W - 4, 0, 4, H)],
      pads: () => [vpad(0, 16, 1, IN), vpad(1, 44, 1, IN)] },
    { name: "VOLLEYBALL", volley: true, win: 15, edges: { left: "bounce", right: "bounce" },
      walls: () => [R(W / 2 - 1, 124, 2, H - 124)], deco: [R(0, H - 3, W, 3)],
      pads: () => [hpad(0, H - 16, -1, { len: 28, from: 2, to: W / 2 - 3 }), hpad(1, H - 16, -1, { len: 28, from: W / 2 + 3, to: W - 2 })] },
    { name: "QUADRAPONG", quad: true, teams: 4, lives: 5, edges: { left: 0, right: 1, top: 2, bottom: 3 },
      walls: quadWalls,
      pads: () => [vpad(0, 8, 1, { from: 16, to: H - 16 }), vpad(1, W - 12, -1, { from: 16, to: H - 16 }), hpad(2, 8, 1, { from: 16, to: W - 16 }), hpad(3, H - 12, -1, { from: 16, to: W - 16 })] },
  ];
  gameNo = clamp(Math.floor(Number(store.get("game", 0))) || 0, 0, MODES.length - 1);
  let mode = MODES[gameNo];

  // Eight zones across a paddle, like the original circuit; volleyball lofts the ball instead
  const ZONES = [-58, -42, -26, -10, 10, 26, 42, 58].map((d) => d * DEG);
  const VZONES = [-45, -34, -22, -10, 10, 22, 34, 45].map((d) => d * DEG);

  // ───────────── Game state ─────────────
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, held: null };
  const game = {
    state: "serve",        // serve | play | over
    demo: true,            // the attract screen: the computer plays every side, silently
    pads: [], walls: [], owners: 2, teams: 2,
    score: [0, 0], lives: [], out: [],
    ctrl: [], vel: [], aim: [], whiff: [], pred: [], holdTo: [],
    serveTimer: 0, serveTo: 1, server: 0, turn: 0, touchTeam: -1, touches: 0,
    hits: 0, sinceHit: 0, overT: 0, winner: null, clock: 0,
  };
  const pressed = [false, false];
  const hook = (window.__pong = { perfect: -1 });

  const edges = () => ({ ...EDGES, ...(mode.edges || {}) });
  const teamOf = (o) => (mode.team ? mode.team[o] : o);
  const isHuman = (o) => !game.demo && (o === 0 || (o === 1 && players === 2));
  const padPos = (p) => p.lo + game.ctrl[p.owner] * (p.hi - p.lo);
  const active = (p) =>
    !(mode.quad && game.out[p.owner]) && !(mode.turns && teamOf(p.owner) !== game.turn);
  const volleyLevel = () => (game.hits < 4 ? 0 : game.hits < 12 ? 1 : 2);
  const speed = () => (mode.volley ? level().vSpeed : level().speeds[volleyLevel()]);

  function setup(demo) {
    mode = MODES[gameNo];
    game.demo = demo;
    game.pads = mode.pads();
    sizePads();
    game.owners = Math.max(...game.pads.map((p) => p.owner)) + 1;
    game.teams = mode.teams || 2;
    game.score = Array(game.teams).fill(0);
    game.lives = Array(game.teams).fill(mode.lives || 0);
    game.out = Array(game.teams).fill(false);
    game.ctrl = Array(game.owners).fill(0.5);
    game.vel = Array(game.owners).fill(0);
    game.aim = Array(game.owners).fill(0);
    game.whiff = Array(game.owners).fill(false);
    game.holdTo = Array(game.owners).fill(0.5);
    game.pred = [];
    game.walls = mode.walls ? mode.walls(game) : [];
    game.serveTo = mode.quad ? Math.floor(Math.random() * 4) : mode.turns ? 0 : 1;
    game.server = 0;
    game.turn = 0;
    game.winner = null;
    game.state = "serve";
    game.serveTimer = demo ? 0.6 : 0.9;
    ball.held = null;
    updateCaps();
  }

  function newGame() {
    setup(false);
    keepAwake(true);
  }

  // The left switch belongs to the left player (and their Doubles partner), the right
  // switch to the right player; Quadrapong's top and bottom players have none
  function sideOf(o) {
    if (mode.quad) return o < 2 ? o : -1;
    return teamOf(o);
  }
  const sizeOf = (o) => (sideOf(o) >= 0 && diffA[sideOf(o)] ? 0.5 : 1);

  // A half-size paddle still reaches both ends of its travel
  function sizePads() {
    for (const p of game.pads) {
      if (p.baseLen === undefined) { p.baseLen = p.len; p.baseHi = p.hi; }
      p.len = Math.max(4, Math.round(p.baseLen * sizeOf(p.owner)));
      p.hi = p.baseHi + (p.baseLen - p.len);
    }
  }

  // Each return, every computer player picks where on its paddle to meet the ball,
  // and now and then misjudges it altogether, so every game can be won.
  // A computer given a half-size paddle aims within it and misjudges twice as often.
  function newAims() {
    const L = level();
    const e = mode.volley ? 3 : L.aimErr;
    for (let o = 0; o < game.owners; o++) {
      const f = sizeOf(o);
      game.aim[o] = rand(-e, e) * f;
      game.whiff[o] = Math.random() < L.whiff / f;
    }
  }

  function launch() {
    const b = ball;
    game.hits = 0;
    game.sinceHit = 0;
    game.touchTeam = -1;
    b.held = null;
    newAims();
    game.state = "play";

    if (mode.volley) {
      // The server's ball drops from above their paddle
      const p = game.pads.find((q) => q.owner === game.server);
      b.x = (p.lo + p.hi + p.len) / 2 - BALL / 2;
      b.y = 30;
      b.vx = 0;
      b.vy = 0;
      return;
    }

    const s = level().speeds[0];
    const a = rand(12, 38) * DEG * (Math.random() < 0.5 ? -1 : 1);

    if (mode.turns) {
      // Off the back wall toward whoever is up
      game.turn = game.serveTo;
      b.x = W - 4 - BALL;
      b.y = rand(H * 0.25, H * 0.75 - BALL);
      b.vx = -Math.cos(a) * s;
      b.vy = Math.sin(a) * s;
      return;
    }

    b.x = W / 2 - BALL / 2;
    if (mode.quad) {
      b.y = H / 2 - BALL / 2;
      const t = game.serveTo;
      const dx = t === 0 ? -1 : t === 1 ? 1 : 0;
      const dy = t === 2 ? -1 : t === 3 ? 1 : 0;
      b.vx = (dx * Math.cos(a) - dy * Math.sin(a)) * s;
      b.vy = (dx * Math.sin(a) + dy * Math.cos(a)) * s;
      return;
    }

    // Serve toward the side that lost the last point
    const dir = game.serveTo === 0 ? -1 : 1;
    b.y = rand(H * 0.25, H * 0.75 - BALL);
    b.vx = dir * Math.cos(a) * s;
    b.vy = Math.sin(a) * s;
  }

  function nextServe(delay) {
    game.state = "serve";
    game.serveTimer = delay;
    ball.held = null;
  }

  function concede(team) {
    SFX.score();
    if (isHuman(team)) buzz([40, 40, 40]);

    if (mode.quad) {
      game.lives[team]--;
      if (game.lives[team] <= 0) {
        game.out[team] = true;
        game.walls = mode.walls(game);
      }
      const alive = [0, 1, 2, 3].filter((t) => !game.out[t]);
      const humansIn = [0, 1].filter((o) => isHuman(o) && !game.out[o]).length;
      const humansAll = [0, 1].filter((o) => isHuman(o)).length;
      if (alive.length <= 1 || (humansAll > 0 && humansIn === 0)) return over(alive.length === 1 ? alive[0] : null);
      game.serveTo = game.out[team] ? alive[Math.floor(Math.random() * alive.length)] : team;
      return nextServe(1.0);
    }

    const scorer = 1 - team;
    game.score[scorer]++;
    if (game.score[scorer] >= (mode.win || 11)) return over(scorer);
    game.serveTo = team;          // serve toward whoever lost the point
    game.server = scorer;         // in volleyball the winner of the point serves
    nextServe(1.0);
  }

  function over(winner) {
    game.state = "over";
    game.overT = 0;
    game.winner = winner;
    ball.held = null;
    if (!game.demo) keepAwake(false);
  }

  function serve() {
    audio();
    if (game.demo || game.state === "over") {
      newGame();
      buzz(25);
    }
  }

  // ───────────── Physics ─────────────
  function bounceWall(b, r) {
    const ox = Math.min(b.x + BALL - r.x, r.x + r.w - b.x);
    const oy = Math.min(b.y + BALL - r.y, r.y + r.h - b.y);
    if (ox <= 0 || oy <= 0) return false;
    if (ox < oy) {
      if (b.x + BALL / 2 < r.x + r.w / 2) { b.x = r.x - BALL; b.vx = -Math.abs(b.vx); }
      else { b.x = r.x + r.w; b.vx = Math.abs(b.vx); }
    } else {
      if (b.y + BALL / 2 < r.y + r.h / 2) { b.y = r.y - BALL; b.vy = -Math.abs(b.vy); }
      else { b.y = r.y + r.h; b.vy = Math.abs(b.vy); }
    }
    return true;
  }

  // Bounce off invisible edges; returns the edge the ball has left by, if any
  function edgeCheck(b, E, sound) {
    if (b.y < 0 && E.top === "bounce") { b.y = -b.y; b.vy = Math.abs(b.vy); if (sound) SFX.wall(); }
    if (b.y > H - BALL && E.bottom === "bounce") { b.y = 2 * (H - BALL) - b.y; b.vy = -Math.abs(b.vy); if (sound) SFX.wall(); }
    if (b.x < 0 && E.left === "bounce") { b.x = -b.x; b.vx = Math.abs(b.vx); if (sound) SFX.wall(); }
    if (b.x > W - BALL && E.right === "bounce") { b.x = 2 * (W - BALL) - b.x; b.vx = -Math.abs(b.vx); if (sound) SFX.wall(); }
    if (b.x < -BALL - 6) return "left";
    if (b.x > W + 6) return "right";
    if (b.y < -BALL - 6) return "top";
    if (b.y > H + 6) return "bottom";
    return null;
  }

  function segRect(p, k) {
    const s = padPos(p) + p.segs[k];
    return p.axis === "y" ? R(p.at, s, PT, p.len) : R(s, p.at, p.len, PT);
  }

  // The ball only bounces off a paddle's front face; from behind it passes through
  function touches(p, k) {
    const r = segRect(p, k), b = ball;
    if (b.x + BALL < r.x || b.x > r.x + r.w || b.y + BALL < r.y || b.y > r.y + r.h) return false;
    if (p.axis === "y") return p.normal > 0 ? b.vx < 0 : b.vx > 0;
    return p.normal > 0 ? b.vy < 0 : b.vy > 0;
  }

  function sendFrom(p, a, s) {
    const b = ball;
    if (p.axis === "y") {
      b.vx = p.normal * Math.cos(a) * s;
      b.vy = Math.sin(a) * s;
      b.x = p.normal > 0 ? p.at + PT : p.at - BALL;
    } else {
      b.vx = Math.sin(a) * s;
      b.vy = p.normal * Math.cos(a) * s;
      b.y = p.normal > 0 ? p.at + PT : p.at - BALL;
    }
  }

  function hit(p, k) {
    const b = ball;
    const start = padPos(p) + p.segs[k];
    const along = p.axis === "y" ? b.y : b.x;
    const rel = clamp((along + BALL / 2 - start) / p.len, 0, 0.999);
    const zones = mode.volley ? VZONES : ZONES;
    const a = zones[Math.floor(rel * zones.length)];
    if (mode.volley) {
      // Three touches a side, then it must go over
      const t = teamOf(p.owner);
      game.touches = game.touchTeam === t ? game.touches + 1 : 1;
      game.touchTeam = t;
      if (game.touches > 3) return concede(t);
    }
    game.hits++;
    game.sinceHit = 0;
    if (mode.turns) game.turn = 1 - game.turn;
    newAims();
    SFX.paddle();
    if (isHuman(p.owner)) buzz(12);

    // CATCH: hold the red button as the ball arrives and it sticks to the paddle
    const human = isHuman(p.owner);
    if (mode.catch && (human ? pressed[p.owner] : Math.random() < 0.3)) {
      b.held = { p, k, off: clamp(along - start, -BALL + 1, p.len - 1), t: 0, owner: p.owner, until: human ? 2 : rand(0.3, 0.9) };
      b.vx = 0;
      b.vy = 0;
      game.holdTo[p.owner] = rand(0.15, 0.85);
      return;
    }
    sendFrom(p, a, speed());
  }

  function follow(dt) {
    const h = ball.held, b = ball, p = h.p;
    h.t += dt;
    game.sinceHit = 0;
    const start = padPos(p) + p.segs[h.k];
    if (p.axis === "y") {
      b.y = start + h.off;
      b.x = p.normal > 0 ? p.at + PT : p.at - BALL;
    } else {
      b.x = start + h.off;
      b.y = p.normal > 0 ? p.at + PT : p.at - BALL;
    }
    const human = isHuman(h.owner);
    if (human ? pressed[h.owner] && h.t < h.until : h.t < h.until) return;

    // Release: the ball flies off the way the paddle was moving, a step faster
    let a;
    if (human) {
      a = clamp(game.vel[h.owner] / 250, -1, 1) * 55 * DEG;
      if (Math.abs(a) < 10 * DEG) a = (a < 0 || (a === 0 && Math.random() < 0.5) ? -1 : 1) * 10 * DEG;
    } else {
      a = rand(20, 50) * DEG * (Math.random() < 0.5 ? -1 : 1);
    }
    b.held = null;
    sendFrom(p, a, level().speeds[Math.min(2, volleyLevel() + 1)]);
    SFX.paddle();
    if (human) buzz(18);
  }

  // ───────────── Computer players ─────────────
  // How far the ball is from a paddle's face, if it is in front of it and coming
  function approach(p) {
    const b = ball;
    if (p.axis === "y") {
      if (p.normal > 0) return b.vx < 0 && b.x >= p.at + PT - 2 ? b.x - (p.at + PT) : Infinity;
      return b.vx > 0 && b.x + BALL <= p.at + 2 ? p.at - (b.x + BALL) : Infinity;
    }
    if (mode.volley) return b.y + BALL <= p.at + 2 ? p.at - b.y : Infinity;
    if (p.normal > 0) return b.vy < 0 && b.y >= p.at + PT - 2 ? b.y - (p.at + PT) : Infinity;
    return b.vy > 0 && b.y + BALL <= p.at + 2 ? p.at - (b.y + BALL) : Infinity;
  }

  // Run the ball forward (walls and gravity, no paddles) to where it meets a paddle's face
  function simulate(p) {
    const s = { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy };
    const g = mode.volley ? level().gravity : 0;
    const E = edges();
    const h = 1 / 120;
    for (let i = 0; i < 480; i++) {
      s.vy += g * h;
      s.x += s.vx * h;
      s.y += s.vy * h;
      if (edgeCheck(s, E, false)) return null;
      for (const r of game.walls) bounceWall(s, r);
      if (p.axis === "y") {
        if (p.normal > 0 ? s.x <= p.at + PT : s.x + BALL >= p.at) return s.y + BALL / 2;
      } else if (p.normal < 0 ? s.vy > 0 && s.y + BALL >= p.at : s.vy < 0 && s.y <= p.at + PT) {
        const c = s.x + BALL / 2;
        return c >= p.lo - BALL && c <= p.hi + p.len + p.segs[p.segs.length - 1] + BALL ? c : null;
      }
    }
    return null;
  }

  function predict(o, p) {
    const c = game.pred[o];
    if (c && c.p === p && game.clock - c.t < 0.05) return c.v;
    const v = simulate(p);
    game.pred[o] = { p, t: game.clock, v };
    return v;
  }

  // Knob position that puts some paddle on the rod centred on c
  function uFor(p, c, now) {
    let best = now, score = Infinity;
    for (const seg of p.segs) {
      const u = (c - p.len / 2 - seg - p.lo) / Math.max(1, p.hi - p.lo);
      const cu = clamp(u, 0, 1);
      const s = Math.abs(cu - u) * 10 + Math.abs(cu - now);
      if (s < score) { score = s; best = cu; }
    }
    return best;
  }

  function cpu(o, dt, perfect) {
    const L = level();
    const mine = game.pads.filter((p) => p.owner === o && active(p));
    if (!mine.length) return;
    let target = 0.5, ref = mine[0];
    if (ball.held && ball.held.owner === o) {
      target = game.holdTo[o];
      ref = ball.held.p;
    } else if (game.state === "play" && !ball.held) {
      let best = null, bestD = Infinity;
      for (const p of mine) {
        const d = approach(p);
        if (d < bestD) { bestD = d; best = p; }
      }
      if (best && (perfect || mode.volley || bestD < L.react)) {
        const c = predict(o, best);
        if (c !== null) {
          ref = best;
          // In volleyball, meet the ball with the end nearer the net so it goes over
          const side = mode.volley ? (best.lo > W / 2 ? 1 : -1) : game.aim[o] < 0 ? -1 : 1;
          const off = !perfect && game.whiff[o]
            ? side * (best.len / 2 + BALL + 6)
            : (perfect ? game.aim[o] / 2 : game.aim[o]) + (mode.volley ? side * best.len * 0.3 : 0);
          target = uFor(best, c + off, game.ctrl[o]);
        }
      }
    }
    const step = perfect ? 1 : (L.cpuSpeed * dt) / Math.max(1, ref.hi - ref.lo);
    game.ctrl[o] += clamp(target - game.ctrl[o], -step, step);
  }

  function controls(dt) {
    for (let o = 0; o < game.owners; o++) {
      const before = game.ctrl[o];
      if (o === hook.perfect) cpu(o, dt, true);
      else if (isHuman(o)) game.ctrl[o] = knobs[o].u();
      else cpu(o, dt, false);
      const p = game.pads.find((q) => q.owner === o);
      const v = ((game.ctrl[o] - before) / dt) * (p.hi - p.lo);
      game.vel[o] = game.vel[o] * 0.85 + v * 0.15;
    }
  }

  function step(dt) {
    game.clock += dt;
    controls(dt);

    if (game.state === "serve") {
      game.serveTimer -= dt;
      if (game.serveTimer <= 0) launch();
      return;
    }
    if (game.state === "over") {
      game.overT += dt;
      if (game.demo && game.overT > 2.5) setup(true);
      return;
    }

    const b = ball;
    if (b.held) return follow(dt);

    if (mode.volley) b.vy += level().gravity * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (mode.volley && b.y + BALL >= H - 3) return concede(b.x + BALL / 2 < W / 2 ? 0 : 1);

    const E = edges();
    const left = edgeCheck(b, E, true);
    if (left) return concede(E[left] === "turn" ? game.turn : E[left]);

    for (const r of game.walls) if (bounceWall(b, r)) SFX.wall();

    outer: for (const p of game.pads) {
      if (!active(p)) continue;
      for (let k = 0; k < p.segs.length; k++) {
        if (touches(p, k)) { hit(p, k); break outer; }
      }
    }

    // A ball that nobody can reach any more is served again
    game.sinceHit += dt;
    if (game.sinceHit > 15) nextServe(0.6);
  }

  // ───────────── Drawing: low-res phosphor buffer, bloomed onto the CRT ─────────────
  const crt = document.getElementById("crt");
  const out = crt.getContext("2d");
  const fb = document.createElement("canvas");
  fb.width = W;
  fb.height = H;
  const g = fb.getContext("2d");
  const canBlur = "filter" in out;

  function rect(x, y, w, h) { g.fillRect(Math.round(x), Math.round(y), w, h); }

  function text(str, cx, y, s) {
    const width = str.length * 4 * s - s;
    let x = Math.round(cx - width / 2);
    g.fillStyle = "#000";
    g.fillRect(x - s, y - s, width + 2 * s, 7 * s);
    g.fillStyle = PHOSPHOR;
    for (const ch of str) {
      const glyph = FONT[ch] || FONT[" "];
      for (let i = 0; i < 15; i++) if (glyph[i] === "1") g.fillRect(x + (i % 3) * s, y + ((i / 3) | 0) * s, s, s);
      x += 4 * s;
    }
  }

  function winnerText() {
    const w = game.winner;
    if (w === null) return "GAME OVER";
    if (players === 1) return w === 0 ? "YOU WIN!" : "CPU WINS";
    if (mode.quad) return w === 0 ? "P1 WINS" : w === 1 ? "P2 WINS" : "CPU WINS";
    return w === 0 ? "P1 WINS" : "P2 WINS";
  }

  function draw(dt) {
    // Phosphor persistence: the last frame fades rather than vanishing
    g.globalAlpha = 1 - Math.pow(0.4, dt * 60);
    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;
    g.fillStyle = PHOSPHOR;

    if (mode.net) for (let y = 2; y < H; y += 8) rect(W / 2 - 1, y, 2, 4);
    for (const r of game.walls) rect(r.x, r.y, r.w, r.h);
    for (const r of mode.deco || []) rect(r.x, r.y, r.w, r.h);

    for (const p of game.pads) {
      if (mode.quad && game.out[p.owner]) continue;
      g.globalAlpha = active(p) ? 1 : 0.35;
      for (let k = 0; k < p.segs.length; k++) {
        const r = segRect(p, k);
        rect(r.x, r.y, r.w, r.h);
      }
    }
    g.globalAlpha = 1;

    if (game.state === "play") rect(ball.x, ball.y, BALL, BALL);

    const blink = Math.floor(game.clock * 2.2) % 2 === 0;

    if (game.demo) {
      text("GAME " + (gameNo + 1), W / 2, 26, 2);
      text(mode.name, W / 2, 46, 4);
      text(players === 2 ? "2 PLAYERS" : "1 PLAYER", W / 2, 82, 2);
      if (blink) text("PRESS SERVE", W / 2, 118, 2);
      text("GAME SWITCH CHANGES GAME", W / 2, 146, 1);
      return;
    }

    if (mode.quad) {
      const at = [[34, H / 2 - 10], [W - 34, H / 2 - 10], [W / 2, 24], [W / 2, H - 38]];
      for (let t = 0; t < 4; t++) if (!game.out[t]) text(String(game.lives[t]), at[t][0], at[t][1], 2);
    } else {
      const y = game.walls.length && !mode.volley ? 8 : 10;
      text(String(game.score[0]), W / 4, y, 4);
      text(String(game.score[1]), (3 * W) / 4, y, 4);
    }

    if (game.state === "over") {
      text(winnerText(), W / 2, 76, 3);
      if (blink) text("PRESS SERVE", W / 2, 116, 2);
    }
  }

  // The picture sits 5% in from the glass so walls at the field's edges stay visible
  function present() {
    const w = crt.width, h = crt.height;
    const ix = Math.round(w * 0.05), iy = Math.round(h * 0.05), iw = w - 2 * ix, ih = h - 2 * iy;
    out.globalCompositeOperation = "source-over";
    out.globalAlpha = 1;
    out.imageSmoothingEnabled = false;
    out.fillStyle = "#06080a";
    out.fillRect(0, 0, w, h);
    out.drawImage(fb, ix, iy, iw, ih);
    // Bloom
    out.globalCompositeOperation = "lighter";
    out.imageSmoothingEnabled = true;
    if (canBlur) {
      out.filter = `blur(${Math.max(1.5, w / 150)}px)`;
      out.globalAlpha = 0.85;
      out.drawImage(fb, ix, iy, iw, ih);
      out.filter = `blur(${Math.max(4, w / 45)}px)`;
      out.globalAlpha = 0.5;
      out.drawImage(fb, ix, iy, iw, ih);
      out.filter = "none";
    } else {
      out.globalAlpha = 0.3;
      out.drawImage(fb, ix, iy, iw, ih);
    }
    out.globalAlpha = 1;
    out.globalCompositeOperation = "source-over";
  }

  function fit() {
    const r = crt.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    crt.width = Math.max(1, Math.round(r.width * dpr));
    crt.height = Math.max(1, Math.round(r.height * dpr));
  }
  new ResizeObserver(fit).observe(crt);
  fit();

  // ───────────── Controller ─────────────
  // Knob: −135° … +135°. Clockwise moves a paddle down, or right in volleyball.
  const KNOB_MAX = 135 * DEG;
  const deck = document.getElementById("deck");

  function makeKnob(i) {
    const zone = document.getElementById("zone" + i);
    const knob = zone.querySelector(".knob");
    const rot = zone.querySelector(".rot");
    const svg = zone.querySelector(".dial");
    const slider = zone.querySelector(".slider");
    const track = zone.querySelector(".track");
    const k = {
      angle: 0,
      set(a) {
        k.angle = clamp(a, -KNOB_MAX, KNOB_MAX);
        rot.style.transform = `rotate(${k.angle}rad)`;
        slider.style.setProperty("--u", k.u().toFixed(4));
        zone.setAttribute("aria-valuenow", String(Math.round(k.u() * 100)));
      },
      u: () => (k.angle + KNOB_MAX) / (2 * KNOB_MAX),
    };

    // Painted scale around the knob
    const ns = "http://www.w3.org/2000/svg";
    for (let t = 0; t <= 20; t++) {
      const major = t % 5 === 0;
      const l = document.createElementNS(ns, "line");
      l.setAttribute("x1", "0");
      l.setAttribute("x2", "0");
      l.setAttribute("y1", String(major ? -98 : -96));
      l.setAttribute("y2", String(major ? -86 : -90));
      l.setAttribute("stroke", "#e8d9bd");
      l.setAttribute("stroke-opacity", major ? "0.85" : "0.45");
      l.setAttribute("stroke-width", major ? "3" : "2");
      l.setAttribute("stroke-linecap", "round");
      l.setAttribute("transform", `rotate(${-135 + t * 13.5})`);
      svg.appendChild(l);
    }

    // Drag around the knob: the change in angle turns it, just like a real dial
    let grab = null;
    const angleAt = (e) => {
      const r = knob.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      return { a: Math.atan2(dy, dx), dist: Math.hypot(dx, dy), radius: r.width / 2 };
    };
    // SLIDE: the knob goes wherever the finger is along the groove
    const slideTo = (e) => {
      const r = track.getBoundingClientRect();
      const u = slider.classList.contains("h") ? (e.clientX - r.left) / r.width : (e.clientY - r.top) / r.height;
      k.set(clamp(u, 0, 1) * 2 * KNOB_MAX - KNOB_MAX);
    };
    zone.addEventListener("pointerdown", (e) => {
      audio();
      zone.setPointerCapture(e.pointerId);
      grab = { id: e.pointerId, last: angleAt(e).a, y: e.clientY };
      if (slide) slideTo(e);
      e.preventDefault();
    });
    zone.addEventListener("pointermove", (e) => {
      if (!grab || e.pointerId !== grab.id) return;
      if (slide) return slideTo(e);
      const p = angleAt(e);
      if (p.dist < p.radius * 0.18) {
        // Too close to the hub to read a direction: treat it as a vertical slide
        k.set(k.angle + ((e.clientY - grab.y) / p.radius) * 1.2);
      } else {
        let d = p.a - grab.last;
        if (d > Math.PI) d -= 2 * Math.PI;
        if (d < -Math.PI) d += 2 * Math.PI;
        k.set(k.angle + d);
      }
      grab.last = p.a;
      grab.y = e.clientY;
    });
    const release = (e) => { if (grab && e.pointerId === grab.id) grab = null; };
    zone.addEventListener("pointerup", release);
    zone.addEventListener("pointercancel", release);
    zone.addEventListener("wheel", (e) => { e.preventDefault(); k.set(k.angle + Math.sign(e.deltaY) * 0.18); }, { passive: false });
    zone.addEventListener("keydown", (e) => {
      const d = { ArrowUp: -0.12, ArrowLeft: -0.12, ArrowDown: 0.12, ArrowRight: 0.12 }[e.key];
      if (d && players === 2) { e.preventDefault(); e.stopPropagation(); k.set(k.angle + d); }
    });
    k.set(0);
    return k;
  }
  const knobs = [makeKnob(0), makeKnob(1)];

  // Red buttons: press to serve; in CATCH, hold to catch the ball
  const fires = [0, 1].map((i) => document.getElementById("fire" + i));
  function press(i, down) {
    pressed[i] = down;
    fires[i].classList.toggle("down", down);
    if (down) serve();
  }
  fires.forEach((f, i) => {
    f.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      f.setPointerCapture(e.pointerId);
      press(i, true);
    });
    f.addEventListener("pointerup", () => press(i, false));
    f.addEventListener("pointercancel", () => press(i, false));
    f.addEventListener("click", (e) => { if (e.detail === 0) serve(); }); // keyboard activation
  });

  function updateCaps() {
    deck.dataset.players = String(players);
    deck.dataset.style = slide ? "slide" : "dial";
    // Volleyball paddles run along the floor, so its groove runs side to side
    const across = !!mode.volley;
    deck.dataset.axis = across ? "h" : "v";
    document.querySelectorAll(".slider").forEach((el) => {
      el.classList.toggle("h", across);
      el.classList.toggle("v", !across);
    });
    document.querySelectorAll(".knob-zone").forEach((z) => {
      if (slide) z.setAttribute("aria-orientation", across ? "horizontal" : "vertical");
      else z.removeAttribute("aria-orientation");
    });
    document.querySelectorAll('[data-cap="knob"]').forEach((c, i) => {
      c.textContent = players === 1 ? (slide ? "SLIDE" : "TURN") : "P" + (i + 1);
    });
    document.querySelectorAll('[data-cap="fire"]').forEach((c) => {
      c.textContent = mode.catch ? (players === 1 ? "SERVE / CATCH" : "CATCH") : "SERVE";
    });
  }

  // Keyboard for desktop. One player: arrows or W/S, Space serves.
  // Two players: W/S and Space for the left, arrows and Enter for the right.
  const keys = new Set();
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "w", "s"].includes(k)) { keys.add(k); e.preventDefault(); }
    if (e.repeat) return;
    if (k === " " && document.activeElement !== fires[0]) { e.preventDefault(); press(0, true); }
    if (k === "enter" && !(document.activeElement instanceof HTMLButtonElement)) { e.preventDefault(); press(players === 2 ? 1 : 0, true); }
    if (k === "g") selectGame();
    if (k === "p") document.getElementById("plyr").click();
  });
  addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    keys.delete(k);
    if (k === " ") press(0, false);
    if (k === "enter") press(players === 2 ? 1 : 0, false);
  });
  (function keyLoop() {
    const step = 0.075;
    const ws = (keys.has("s") ? 1 : 0) - (keys.has("w") ? 1 : 0);
    const ar = (keys.has("arrowdown") ? 1 : 0) - (keys.has("arrowup") ? 1 : 0);
    if (players === 2) {
      if (ws) knobs[0].set(knobs[0].angle + ws * step);
      if (ar) knobs[1].set(knobs[1].angle + ar * step);
    } else if (ws || ar) {
      knobs[0].set(knobs[0].angle + Math.sign(ws + ar) * step);
    }
    requestAnimationFrame(keyLoop);
  })();

  // GAME SELECT steps through the games and stops any game in progress
  const gameBtn = document.getElementById("gameBtn");
  function selectGame() {
    audio();
    gameNo = (gameNo + 1) % MODES.length;
    store.set("game", gameNo);
    setup(true);
    keepAwake(false);
    SFX.click();
  }
  gameBtn.addEventListener("pointerdown", () => gameBtn.classList.add("down"));
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) => gameBtn.addEventListener(t, () => gameBtn.classList.remove("down")));
  gameBtn.addEventListener("click", selectGame);

  // Toggle switches
  function wireSwitch(id, get, set) {
    const el = document.getElementById(id);
    el.setAttribute("aria-checked", String(get()));
    el.addEventListener("click", () => {
      set(!get());
      el.setAttribute("aria-checked", String(get()));
      audio();
      buzz(10);
      SFX.click();
    });
  }
  wireSwitch("diffL", () => diffA[0], (v) => { diffA[0] = v; store.set("diffL", v); sizePads(); });
  wireSwitch("diffR", () => diffA[1], (v) => { diffA[1] = v; store.set("diffR", v); sizePads(); });
  wireSwitch("snd", () => soundOn, (v) => { soundOn = v; });
  wireSwitch("style", () => !slide, (v) => {
    slide = !v;
    store.set("slide", slide);
    updateCaps();
  });
  wireSwitch("plyr", () => players === 1, (v) => {
    players = v ? 1 : 2;
    store.set("players", players);
    setup(true);
    keepAwake(false);
  });

  // Full screen
  const full = document.getElementById("full");
  if (!document.documentElement.requestFullscreen || document.fullscreenEnabled === false || matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches) {
    full.hidden = true;
  }
  full.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  });

  // Keep the screen awake during a game
  let lock = null;
  async function keepAwake(on) {
    try {
      if (on && !lock && navigator.wakeLock) {
        lock = await navigator.wakeLock.request("screen");
        lock.addEventListener("release", () => { lock = null; });
      } else if (!on && lock) {
        await lock.release();
        lock = null;
      }
    } catch {}
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !game.demo && game.state !== "over") keepAwake(true);
  });

  addEventListener("contextmenu", (e) => e.preventDefault());

  // ───────────── Loop ─────────────
  setup(true);
  const STEP = 1 / 240;
  let acc = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    draw(dt);
    present();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Test hook (harmless in play): `perfect` lets a flawless robot take a side in balance tests
  Object.assign(hook, {
    game, ball, step, knobs, MODES, LEVEL, press, newGame,
    setGame: (n) => { gameNo = n; setup(true); },
    setPlayers: (n) => { players = n; setup(true); },
    setSlide: (v) => { slide = v; updateCaps(); },
    setDiff: (side, a) => { diffA[side] = a; sizePads(); },
  });
})();
</script>
</body>
</html>
