<!-- The one address the posters' QR codes, the social bios and the game's own Share with a friend
     print. A phone goes straight to its own store; anything else to the Box Stack page, which has both
     badges and a round in the browser. ?from= names the poster, the app whose bio it is (`tiktok`, or
     `tiktok-<post>` for one post), or `share` for a player passing the game on from its About sheet,
     and rides into Google Play's install referrer, so Play Console counts installs by each. -->
<script>
  (function () {
    var from = (new URLSearchParams(location.search).get("from") || "").toLowerCase();
    if (!/^[a-z0-9-]{1,32}$/.test(from)) from = "web";
    // A bio's link is social traffic from that app, the game's share is a player telling a friend;
    // everything else is a poster's QR code.
    var social = /^(tiktok|instagram|youtube)(-|$)/.exec(from);
    var source = from === "share" ? "utm_source=app&utm_medium=share"
      : social ? "utm_source=" + social[1] + "&utm_medium=social" : "utm_source=poster&utm_medium=qr";
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (ios) {
      location.replace("https://apps.apple.com/us/app/box-stack-tower-puzzle/id6818697355");
    } else if (/Android/i.test(ua)) {
      location.replace("https://play.google.com/store/apps/details?id=com.boxstacker.app&referrer=" +
        encodeURIComponent(source + "&utm_campaign=" + from));
    } else {
      location.replace("../box-stack/");
    }
  })();
</script>
