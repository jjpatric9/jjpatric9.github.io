<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Box Stack · Tallman Games</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tallman-games.com/box-stack/">
<meta name="theme-color" content="#230d30">
<link rel="icon" href="../img/favicon-32.png" sizes="32x32" type="image/png">
<!-- The one address the posters' QR codes and the social bios print. A phone goes straight to its own
     store; anything else to the Box Stack page, which has both badges and a round in the browser.
     ?from= names the poster, or the app whose bio it is (`tiktok`, or `tiktok-<post>` for one post),
     and rides into Google Play's install referrer, so Play Console counts installs by each. -->
<script>
  (function () {
    var from = (new URLSearchParams(location.search).get("from") || "").toLowerCase();
    if (!/^[a-z0-9-]{1,32}$/.test(from)) from = "web";
    // A bio's link is social traffic from that app; everything else is a poster's QR code.
    var social = /^(tiktok|instagram|youtube)(-|$)/.exec(from);
    var source = social ? "utm_source=" + social[1] + "&utm_medium=social" : "utm_source=poster&utm_medium=qr";
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (ios) {
      location.replace("https://apps.apple.com/us/app/box-stack-tower-puzzle/id6818697355");
    } else if (/Android/i.test(ua)) {
      location.replace("https://play.google.com/store/apps/details?id=com.boxstacker.app&referrer=" +
        encodeURIComponent(source + "&utm_campaign=" + from));
    } else {
      location.replace("../box-stack/");
    }
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../box-stack/"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 16px; text-align: center;

  a { color: inherit; }
  .stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>

    <a href="https://play.google.com/store/apps/details?id=com.boxstacker.app" rel="noopener"><img src="../img/badge-google-play.png" width="175" height="52" alt="Get it on Google Play"></a>
  </div>
</body>
</html>
